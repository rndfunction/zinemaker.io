<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine Forge - Make and share zines</title>
  <!-- Content-Security-Policy: report-only first. Flip to enforcing
       (change Content-Security-Policy-Report-Only to Content-Security-Policy)
       once the console is clean across every view: editor, reader, sheet,
       library, share link, and print. style-src needs unsafe-inline because
       the mini-page uses inline style= for element positioning; the
       zfSanitizeHtml allowlist already restricts which style props survive.
       connect-src allows the Iconify search/SVG APIs. -->
  <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self' https://unpkg.com https://code.iconify.design; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://api.iconify.design; object-src 'none'; base-uri 'self';" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" defer></script>

  <script src="js/zine-models.js"></script>
  <script src="js/zine-themes.js"></script>
  <script src="js/zine-library.js"></script>
  <script src="js/util.js"></script>
  <script src="js/components/ZfErrorBoundary.js"></script>
  <script src="js/components/ZineIconPicker.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>

  <template id="zine-app-shell-template">
    <div>
      <header class="zf2-masthead">
        <div class="zf2-masthead-titles">
          <span class="zf2-kicker">Zine &middot; {{ store.view }}</span>
          <input
            class="zf2-title zf2-title-input"
            v-model="store.title"
            placeholder="Untitled Zine"
            aria-label="Zine title"
            title="Click to rename this zine"
            maxlength="80"
          />
          <div class="zf2-meta">
            <span v-if="store.author">by {{ store.author }}</span>
            <span v-if="store.author" aria-hidden="true">&middot;</span>
            <span class="zf-save-indicator" v-if="savedLabel" title="Your draft is saved in this browser" aria-live="polite">{{ savedLabel }}</span>
          </div>
        </div>
        <div class="zf2-masthead-actions">
          <button class="zf2-ghost" @click="goLibrary" :aria-current="store.view === 'library'" title="Browse your saved zines">
            <iconify-icon icon="ph:books" aria-hidden="true" style="vertical-align:-2px;"></iconify-icon>
            Library
          </button>
          <span class="zf2-masthead-sep" aria-hidden="true"></span>
          <button class="zf2-ghost" @click="onNew">New</button>
          <label class="zf2-ghost" style="cursor:pointer;" title="Load a previously exported .zine.json file">
            Import
            <input type="file" accept=".json,application/json" style="display:none;" @change="onImport" />
          </label>
          <button class="zf2-ghost" @click="onExport" title="Download this zine as a JSON file">Export</button>
          <button class="zf2-ghost" @click="onSaveToLibrary" title="Save this zine to your library">
            <iconify-icon icon="ph:floppy-disk" aria-hidden="true" style="vertical-align:-2px;"></iconify-icon>
            Save
          </button>
          <button class="zf2-ghost" @click="store.settingsOpen = !store.settingsOpen" :aria-expanded="store.settingsOpen" title="Toggle zine settings" aria-haspopup="dialog">
            <iconify-icon icon="ph:gear-six" aria-hidden="true" style="vertical-align:-2px;"></iconify-icon>
            Settings
          </button>
        </div>
      </header>
      <nav class="zf2-viewtabs" aria-label="Sections">
        <button class="zf2-tab" :aria-current="store.view === 'editor'" @click="goEditor">Editor</button>
        <button class="zf2-tab" :aria-current="store.view === 'reader'" @click="goReader">Read</button>
        <button class="zf2-tab" :aria-current="store.view === 'sheet'" @click="goSheet">Print</button>
      </nav>

      <main class="zf-main">
        <div v-if="store.status" class="zf-muted" role="status" aria-live="polite">{{ store.status }}</div>
        <section data-zf-view="editor" v-show="store.view === 'editor'"><zf-error-boundary><zine-editor></zine-editor></zf-error-boundary></section>
        <section data-zf-view="reader" v-show="store.view === 'reader'"><zf-error-boundary><zine-reader></zine-reader></zf-error-boundary></section>
        <section data-zf-view="sheet" v-show="store.view === 'sheet'"><zf-error-boundary><zine-sheet></zine-sheet></zf-error-boundary></section>
        <section data-zf-view="library" v-show="store.view === 'library'"><zf-error-boundary><zine-library></zine-library></zf-error-boundary></section>
      </main>

      <div class="zf-modal-backdrop" v-if="store.newZineOpen" @click.self="cancelNewZine">
        <div class="zf-modal" role="dialog" aria-label="Start a new zine">
          <div class="zf-modal-header">
            <h2>Start a new zine</h2>
            <button class="zf-modal-close" @click="cancelNewZine" aria-label="Close">&times;</button>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-new-model">Format</label>
            <select id="zf-new-model" class="zf-input" v-model="store.pendingModelId">
              <option v-for="m in models" :key="m.id" :value="m.id">{{ m.label }}</option>
            </select>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-new-template">Template</label>
            <select id="zf-new-template" class="zf-input" v-model="store.pendingTemplateId">
              <option v-for="t in store.newZineTemplates" :key="t.id" :value="t.id">{{ t.label }}</option>
            </select>
          </div>
          <div class="zf-muted" style="font-size:0.8rem;margin-bottom:1rem;">
            This replaces your current zine with blank pages in the chosen format.
          </div>
          <div class="zf-header-actions" style="justify-content:flex-end;">
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="cancelNewZine">Cancel</button>
            <button class="zf-btn zf-btn-primary" @click="confirmNewZine">Create</button>
          </div>
        </div>
      </div>
      <div class="zf-settings-backdrop" v-if="store.settingsOpen" @click="store.settingsOpen = false" aria-hidden="true"></div>
      <div class="zf-settings-slide" :class="{ open: store.settingsOpen }" role="dialog" aria-label="Zine settings" @keydown.esc="store.settingsOpen = false">
        <div class="zf-settings-slide-head">
          <strong>Zine settings</strong>
          <button class="zf-icon-btn" @click="store.settingsOpen = false" aria-label="Close settings">&times;</button>
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-model">Zine model</label>
          <select id="zf-zine-model" class="zf-input" :value="store.modelId" @change="store.setModel($event.target.value)">
            <option v-for="m in models" :key="m.id" :value="m.id">{{ m.label }}</option>
          </select>
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-theme">Theme</label>
          <select id="zf-zine-theme" class="zf-input" :value="store.themeId" @change="store.setTheme($event.target.value)">
            <option v-for="t in themes" :key="t.id" :value="t.id">{{ t.label }}</option>
          </select>
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-margin">Page margin ({{ store.marginIn }} in)</label>
          <input id="zf-zine-margin" type="range" min="0.04" max="0.35" step="0.01"
                 :value="store.marginIn" @input="store.setMargin($event.target.value)" style="width:100%;" />
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-printer-safety">Printer safe area ({{ store.printerSafetyIn }} in)</label>
          <input id="zf-zine-printer-safety" type="range" min="0" max="0.5" step="0.01"
                 :value="store.printerSafetyIn" @input="store.setPrinterSafety($event.target.value)" style="width:100%;" />
          <div class="zf-muted" style="font-size:0.75rem;margin-top:0.15rem;">Shows where most printers can't reach. Content outside this area may be clipped.</div>
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-safe-edge">Edge safety margin ({{ store.safeEdgeIn }} in)</label>
          <input id="zf-zine-safe-edge" type="range" min="0" max="0.75" step="0.01"
                 :value="store.safeEdgeIn" @input="store.setSafeEdge($event.target.value)" style="width:100%;" />
          <div class="zf-muted" style="font-size:0.75rem;margin-top:0.15rem;">Extra padding auto-applied to the outer edge of corner pages so your printer doesn't clip them.</div>
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-title">Zine title</label>
          <input id="zf-zine-title" class="zf-input" v-model="store.title" />
        </div>
        <div class="zf-field">
          <label class="zf-label" for="zf-zine-author">Author</label>
          <input id="zf-zine-author" class="zf-input" v-model="store.author" />
        </div>
      </div>
    </div>
  </template>

  <template id="zine-reader-template">
    <div class="zf-reader">
      <div class="zf-no-print" style="margin-bottom:1rem;">
        <h2 style="margin:0;font-family:var(--zf-serif);">{{ store.title || 'Untitled Zine' }}</h2>
        <div class="zf-muted" v-if="store.author">by {{ store.author }}</div>
      </div>
      <article class="zf-mini-page" v-if="page" :style="Object.assign({}, readerThemeStyle, readerPageStyle)">

        <template v-for="img in (page.images || [])" :key="'r-blk-' + img.id">
          <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
               class="zf-mini-image zf-block-image" :src="img.src" alt="Page illustration"
               :style="readerBlockImageStyleFor(img)" />
          <iconify-icon v-else-if="img.wrap === 'block' && img.kind === 'icon'"
               class="zf-mini-image zf-block-image zf-block-icon" :icon="img.src"
               :style="Object.assign({}, readerBlockImageStyleFor(img), { color: img.color || 'inherit' })"></iconify-icon>
        </template>
        <!-- Inline page body retired (reader): text lives in text boxes. -->
        <template v-for="img in (page.images || [])" :key="'r-free-' + img.id">
          <div v-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'tape'"
               class="zf-tape zf-positioned" :class="'zf-tape-' + (img.color || 'beige')"
               :style="readerFreeImageStyleFor(img)" aria-hidden="true"></div>
          <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'scrap'"
               class="zf-scrap zf-positioned" :class="'zf-scrap-' + (img.color || 'kraft')"
               :style="readerFreeImageStyleFor(img)" aria-hidden="true"></div>
          <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticky'"
               class="zf-sticky zf-positioned" :class="'zf-sticky-' + (img.color || 'yellow')"
               :style="stickyStyle(img, readerFreeImageStyleFor(img))" aria-hidden="true"></div>
          <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticker'"
               class="zf-sticker zf-positioned" :class="'zf-sticker-' + (img.shape || 'circle')"
               :style="stickerStyle(img, readerFreeImageStyleFor(img))" aria-hidden="true"></div>
          <img v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind !== 'icon'"
               class="zf-mini-image zf-positioned" :src="img.src" alt="Page illustration"
               :style="readerFreeImageStyleFor(img)" />
          <iconify-icon v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'icon'"
               class="zf-mini-image zf-positioned zf-positioned-icon" :icon="img.src"
               :style="Object.assign({}, readerFreeImageStyleFor(img), { color: img.color || 'inherit' })"></iconify-icon>
        </template>
        <template v-for="box in (page.textBoxes || [])" :key="'r-tb-' + box.id">
            <div class="zf-textbox zf-textbox-readonly" :class="{ 'zf-stamp': box.kind === 'stamp', 'zf-panel': box.kind === 'panel', 'zf-textbox-overlay': box.overlay }" :style="readerTextBoxStyleFor(box)">
            <div class="zf-textbox-content" v-html="box.html"></div>
          </div>
        </template>
      </article>
      <div class="zf-pager zf-no-print">
        <button class="zf-btn" style="border-color:var(--zf-border);" :disabled="currentIndex === 0" @click="prev">&larr; Previous</button>
        <span class="zf-muted">Page {{ currentIndex + 1 }} of {{ total }}</span>
        <button class="zf-btn" style="border-color:var(--zf-border);" :disabled="currentIndex >= total - 1" @click="next">Next &rarr;</button>
      </div>
    </div>
  </template>

  <template id="zine-editor-template">
    <div class="zf-editor" :class="{ 'zf-drawing': drawingMode }">
      <aside>

        <div class="zf-field" style="margin-bottom:0.25rem;">
          <label class="zf-label" for="zf-sidebar-model">Model</label>
          <select id="zf-sidebar-model" class="zf-input" :value="store.modelId" @change="store.setModel($event.target.value)">
            <option v-for="m in models" :key="m.id" :value="m.id">{{ m.label }}</option>
          </select>
        </div>
        <div class="zf-label" style="margin-top:0.75rem;">Pages</div>
        <ul class="zf-page-list">
          <li v-for="(p, i) in store.pages" :key="p.id"
              :class="[{ active: p.id === store.activePageId, 'zf-draggable': true }, dragClass(i)]"
              draggable="true"
              @click="selectPage(p.id)"
              @dragstart="onDragStart($event, i)"
              @dragover="onDragOver($event, i)"
              @dragleave="onDragLeave($event, i)"
              @drop="onDrop($event, i)"
              @dragend="onDragEnd">
            <span style="display:flex;align-items:center;gap:0.25rem;min-width:0;">
              <span class="zf-page-grip" aria-hidden="true" title="Drag to reorder">&#x2261;</span>
              <span class="zf-page-num" :class="{ cover: i === 0, back: i === store.pages.length - 1 && store.pages.length > 1 }">{{ i + 1 }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ pageLabel(p, i) }}<span class="zf-mini" v-if="p.image"> (img)</span></span>
            </span>
            <span class="zf-page-tools">
              <button class="zf-icon-btn" @click.stop="store.duplicatePage(p.id)" title="Duplicate page">+</button>
              <button class="zf-icon-btn" @click.stop="store.deletePage(p.id)" title="Delete page">&times;</button>
            </span>
          </li>
          <li class="zf-page-add" @click="store.addPageOrSheet()" role="button" tabindex="0"
              :title="store.isCurrentSheetFull() ? 'This sheet is full. Add a new sheet.' : 'Add a new page at the end'">
            <span class="zf-page-add-label" v-if="!store.isCurrentSheetFull()">+ Add page</span>
            <span class="zf-page-add-label" v-else>+ Add sheet ({{ activeModel ? activeModel.pagesPerSheet : '' }} pages)</span>
          </li>
        </ul>


        <div class="zf-sidebar-layers">
          <button class="zf-sidebar-section-head" @click="layersOpen = !layersOpen" :aria-expanded="layersOpen">
            <span>Layers <span class="zf-mini">&mdash; {{ layers.length }}</span></span>
            <span aria-hidden="true">{{ layersOpen ? "\u25be" : "\u25b8" }}</span>
          </button>
          <div v-show="layersOpen" class="zf-sidebar-layers-body">
            <div v-if="!layers.length" class="zf-muted" style="font-size:0.8rem;">No objects on this page yet.</div>
            <ul class="zf-layers-list" v-else>
               <li v-for="(layer, li) in layers" :key="layer.id"
                   draggable="true"
                   :class="[{ active: isSelected(layer.kind === 'textBox' ? 'textBox' : 'image', layer.id) }, layerDragClass(li)]"
                   @click="selectLayer(layer, $event)"
                  @dragstart="onLayerDragStart($event, li)"
                  @dragover="onLayerDragOver($event, li)"
                  @dragleave="onLayerDragLeave($event, li)"
                  @drop="onLayerDrop($event, li)"
                  @dragend="onLayerDragEnd">
                <iconify-icon class="zf-layer-ico"
                  :icon="layer.kind === 'textBox' ? 'ph:text-t' : (layer.kind === 'icon' ? 'ph:star' : 'ph:image')"
                  aria-hidden="true"></iconify-icon>
                 <span class="zf-layer-label">{{ layerLabel(layer) }}</span>
                 <span class="zf-layer-tools">
                   <button class="zf-icon-btn zf-layer-chain" :class="{ linked: isGrouped(layer.id) }"
                           @click.stop="toggleLayerGroup(layer)"
                           :title="isGrouped(layer.id) ? 'Unlink from group' : 'Link with selection'"
                           :aria-label="isGrouped(layer.id) ? 'Unlink from group' : 'Link with selection'"
                           :aria-pressed="isGrouped(layer.id)">
                     <iconify-icon :icon="isGrouped(layer.id) ? 'ph:link-simple' : 'ph:link-simple-break'" aria-hidden="true"></iconify-icon>
                   </button>
                   <button class="zf-icon-btn" @click.stop="toggleLayerHidden(layer)" :title="layer.el.hidden ? 'Show layer' : 'Hide layer'" :aria-label="layer.el.hidden ? 'Show layer' : 'Hide layer'">
                     <iconify-icon :icon="layer.el.hidden ? 'ph:eye-slash' : 'ph:eye'" aria-hidden="true"></iconify-icon>
                   </button>
                  <button class="zf-icon-btn" @click.stop="removeLayer(layer)" title="Delete layer" aria-label="Delete layer">&times;</button>
                </span>
              </li>
            </ul>
          </div>
        </div>
        <div class="zf-sidebar-danger">
          <button type="button" class="zf-sidebar-clear" @click="onClearAllEditor" title="Remove all content from every page">
            Clear all content
          </button>
        </div>
      </aside>

      <div class="zf-canvas-col">
        <div class="zf-canvas-empty-hint" v-if="isEmptyPage(active)">
          Start your page: type a heading, then write below. Use the tools on the right to add an image, icon, or text box.
        </div>
        <div class="zf-canvas-wrap">
          <div class="zf-ghost-page zf-ghost-prev" v-if="prevPage" role="button" tabindex="0"
               @click="goToPageId(prevPage.id)" @keydown.enter="goToPageId(prevPage.id)"
               :aria-label="'Go to previous page'"
               :title="'Go to previous page'">
            <span class="zf-ghost-label">Page {{ activeIndex }}</span>
            <div class="zf-ghost-render" aria-hidden="true">
              <div class="zf-mini-page zf-ghost-mini" :style="ghostPageStyle(prevPage)">
                <template v-for="img in (prevPage.images || [])" :key="'gpb-' + img.id">
                  <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                       class="zf-mini-image zf-block-image" :src="img.src" alt=""
                       :style="ghostBlockStyle(img)" />
                  <iconify-icon v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                       class="zf-mini-image zf-block-image zf-block-icon" :icon="img.src"
                       :style="Object.assign({}, ghostBlockStyle(img), { color: img.color || 'inherit' })"></iconify-icon>
                </template>
                <div class="zf-mini-body" v-html="prevPage.body"></div>
                <template v-for="img in (prevPage.images || [])" :key="'gpf-' + img.id">
                  <div v-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'tape'"
                       class="zf-tape zf-positioned" :class="'zf-tape-' + (img.color || 'beige')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'scrap'"
                       class="zf-scrap zf-positioned" :class="'zf-scrap-' + (img.color || 'kraft')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticky'"
                       class="zf-sticky zf-positioned" :class="'zf-sticky-' + (img.color || 'yellow')" :style="stickyStyle(img, ghostFreeStyle(img))"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticker'"
                       class="zf-sticker zf-positioned" :class="'zf-sticker-' + (img.shape || 'circle')" :style="stickerStyle(img, ghostFreeStyle(img))"></div>
                  <img v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind !== 'icon'"
                       class="zf-mini-image zf-positioned" :src="img.src" alt="" :style="ghostFreeStyle(img)" />
                  <iconify-icon v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'icon'"
                       class="zf-mini-image zf-positioned zf-positioned-icon-wrap" :icon="img.src"
                       :style="Object.assign({}, ghostFreeStyle(img), { color: img.color || 'inherit' })"></iconify-icon>
                </template>
                <template v-for="box in (prevPage.textBoxes || [])" :key="'gpt-' + box.id">
                  <div v-if="!box.hidden" class="zf-textbox zf-textbox-readonly"
                       :class="{ 'zf-stamp': box.kind === 'stamp', 'zf-panel': box.kind === 'panel', 'zf-textbox-overlay': box.overlay }"
                       :style="ghostTextBoxStyle(box)">
                    <div class="zf-textbox-content" v-html="box.html"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <div class="zf-page zf-mini-page" ref="miniPage" :style="Object.assign({}, pageStyle, pageThemeStyle)" @mousedown="onBodyMouseDown">
            <template v-for="g in safeGuides" :key="g.key">
              <div class="zf-mini-safe-guide" :style="g.style"></div>
            </template>

            <!-- Drawing overlay: only present while drawingMode is on. Sits on
                 top of the page content and captures pointer events so a drag
                 draws a stroke instead of dragging an element or editing text.
                 The toolbar floats above it. -->
            <!-- Drawing overlay: just the canvas now. The tools live in a
                 panel in the right rail (see .zf-draw-panel) so they do not
                 cover the page. -->
            <div v-if="drawingMode" class="zf-draw-layer">
              <canvas ref="drawCanvas" class="zf-draw-canvas"
                      @pointerdown="onDrawPointerDown"
                      @pointermove="onDrawPointerMove"
                      @pointerup="onDrawPointerUp"
                      @pointerleave="onDrawPointerUp"></canvas>
            </div>

            <template v-for="img in (active.images || [])" :key="'blk-' + img.id">
              <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                   class="zf-mini-image zf-block-image"
                   :src="img.src" alt="Page illustration"
                   :style="imageBlockStyle(img)" />
              <iconify-icon v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                   class="zf-mini-image zf-block-image zf-block-icon"
                   :icon="img.src"
                   :style="Object.assign({}, imageBlockStyle(img), { color: img.color || 'inherit' })"></iconify-icon>
            </template>
              <!-- Inline page body retired: text lives in text boxes only. -->

            <template v-for="box in (active.textBoxes || [])" :key="'tb-' + box.id">
              <div v-if="!box.hidden" class="zf-textbox"
                   tabindex="0"

            <label class="zf-image-control-label">Rotation ({{ activeImage.rot || 0 }}&deg;)</label>
            <input type="range" min="-180" max="180" step="1"
                   :value="activeImage.rot || 0" @input="setImageRot($event.target.value)" style="flex:1;" />
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Layout</label>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeImage.wrap === 'free' || !activeImage.wrap) ? 'var(--zf-blue)' : '#ffffff', color: (activeImage.wrap === 'free' || !activeImage.wrap) ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setImageWrap('free')">Text behind image</button>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeImage.wrap === 'block') ? 'var(--zf-blue)' : '#ffffff', color: (activeImage.wrap === 'block') ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setImageWrap('block')">Above text</button>
          </div>
          <div class="zf-image-control-row">
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="fitImage">Fit width</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="resetImage">Reset</button>
            <span class="zf-muted" style="font-size:0.8rem;" v-else-if="activeImage.wrap === 'free' || !activeImage.wrap">Drag the image. Text sits underneath it.</span>
            <span class="zf-muted" style="font-size:0.8rem;" v-else>Sits above the body text.</span>
          </div>
          <div class="zf-image-control-row" v-if="activeImage.kind === 'icon'">
            <label class="zf-image-control-label">Icon color</label>
            <input type="color" :value="activeImage.color || '#1b1b1b'" @input="setIconColor($event.target.value)" style="width:40px;height:26px;border:1px solid var(--zf-border);border-radius:4px;background:#ffffff;cursor:pointer;" />
            <button class="zf-btn" style="border-color:var(--zf-border);font-size:0.8rem;" @click="setIconColor('')">Use theme color</button>
          </div>
          <div class="zf-image-control-row" v-if="activeImage.kind === 'sticker'">
            <label class="zf-image-control-label">Shape</label>
            <button class="zf-btn" :style="shapeBtnStyle('circle')" @click="setStickerShape('circle')">Circle</button>
            <button class="zf-btn" :style="shapeBtnStyle('oval')" @click="setStickerShape('oval')">Oval</button>
            <button class="zf-btn" :style="shapeBtnStyle('square')" @click="setStickerShape('square')">Square</button>
            <button class="zf-btn" :style="shapeBtnStyle('starburst')" @click="setStickerShape('starburst')">Star</button>
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Layer</label>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="bringToFront" title="Move this element in front of everything else on the page">Front</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="bringForward" title="Move this element forward one step">Forward</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="sendBackward" title="Move this element backward one step">Backward</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="sendToBack" title="Move this element behind everything else on the page">Back</button>
          </div>
        </div>

        <div v-if="activeTextBox" class="zf-image-controls">
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Text box selected</label>
            <span class="zf-muted" style="font-size:0.8rem;">Click the box to edit, or drag it to move. Use the handles to resize/rotate.</span>
          </div>

          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Width ({{ (activeTextBox.w || 1.8).toFixed(2) }} in)</label>
            <input type="range" min="0.4" max="8" step="0.05"
                   :value="activeTextBox.w || 1.8" @input="setTextBoxW($event.target.value)" style="flex:1;" />
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Rotation ({{ activeTextBox.rot || 0 }}&deg;)</label>
            <input type="range" min="-180" max="180" step="1"
                   :value="activeTextBox.rot || 0" @input="setTextBoxRot($event.target.value)" style="flex:1;" />
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Font size (pt)</label>
            <input type="number" min="4" max="200" step="0.5" style="width:64px;"
                   :value="textBoxFontPt(activeTextBox)"
                   @input="setTextBoxFontSize($event.target.value)"
                   @change="setTextBoxFontSize($event.target.value)" aria-label="Font size in points" />
            <input type="range" min="4" max="72" step="0.5" style="flex:1;"
                   :value="textBoxFontPt(activeTextBox)"
                   @input="setTextBoxFontSize($event.target.value)" aria-label="Font size slider" />
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Line height ({{ (activeTextBox.lineHeight || 1.35).toFixed(2) }})</label>
            <input type="range" min="0.9" max="2.2" step="0.05"
                   :value="activeTextBox.lineHeight || 1.35" @input="setTextBoxLineHeight($event.target.value)" style="flex:1;" />
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Font</label>
            <select class="zf-input" style="flex:1;font-size:0.85rem;" :value="activeTextBox.fontFamily || ''" @change="setTextBoxFontFamily($event.target.value)">
            <option value="">Use theme default</option>
            <option value="Georgia, 'Times New Roman', serif">Georgia (serif)</option>
            <option value="'Iowan Old Style', Palatino, Georgia, serif">Palatino (serif)</option>
            <option value="'Times New Roman', Times, serif">Times (serif)</option>
            <option value="Garamond, 'Iowan Old Style', Georgia, serif">Garamond (serif)</option>
            <option value="'Public Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">Public Sans (sans)</option>
            <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica (sans)</option>
            <option value="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">System UI (sans)</option>
            <option value="Verdana, Geneva, Tahoma, sans-serif">Verdana (sans)</option>
            <option value="'Trebuchet MS', 'Helvetica Neue', Helvetica, Arial, sans-serif">Trebuchet MS (sans)</option>
            <option value="Impact, 'Arial Black', sans-serif">Impact (bold)</option>
            <option value="'Arial Black', 'Arial Bold', Gadget, sans-serif">Arial Black (bold)</option>
            <option value="'Courier New', Courier, monospace">Courier (mono)</option>
            <option value="ui-monospace, 'SF Mono', Menlo, Consolas, 'Courier New', monospace">Monospace (mono)</option>
              <option value="'Comic Sans MS', cursive">Comic (casual)</option>
            </select>
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Align</label>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeTextBox.align === 'left' || !activeTextBox.align) ? 'var(--zf-blue)' : '#ffffff', color: (activeTextBox.align === 'left' || !activeTextBox.align) ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setTextBoxAlign('left')">Left</button>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeTextBox.align === 'center') ? 'var(--zf-blue)' : '#ffffff', color: (activeTextBox.align === 'center') ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setTextBoxAlign('center')">Center</button>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeTextBox.align === 'right') ? 'var(--zf-blue)' : '#ffffff', color: (activeTextBox.align === 'right') ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setTextBoxAlign('right')">Right</button>
            <button class="zf-btn" :style="{ borderColor: 'var(--zf-border)', background: (activeTextBox.align === 'justify') ? 'var(--zf-blue)' : '#ffffff', color: (activeTextBox.align === 'justify') ? '#ffffff' : 'var(--zf-blue-dark)' }" @click="setTextBoxAlign('justify')">Justify</button>
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Color</label>
            <input type="color" :value="activeTextBox.color || '#1b1b1b'" @input="setTextBoxColor($event.target.value)" style="width:40px;height:26px;border:1px solid var(--zf-border);border-radius:4px;background:#ffffff;cursor:pointer;" />
            <button class="zf-btn" style="border-color:var(--zf-border);font-size:0.8rem;" @click="setTextBoxColor('')">Reset color</button>
          </div>
          <div class="zf-image-control-row">
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="resetTextBox">Reset</button>
            <span class="zf-muted" style="font-size:0.8rem;">If the box looks reversed or off, click Reset to restore defaults.</span>
          </div>
          <div class="zf-image-control-row">
            <label class="zf-image-control-label">Layer</label>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="bringToFront" title="Move this text box in front of everything else on the page">Front</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="bringForward" title="Move this text box forward one step">Forward</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="sendBackward" title="Move this text box backward one step">Backward</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="sendToBack" title="Move this text box behind everything else on the page">Back</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Application code is split across the files below. Load order matters:
       models/themes/library/util define the data + helpers the rest depend
       on; zf-store defines the shared reactive store; the component files
       (app-shell, editor, reader, sheet, library-view) define the views;
       zf-boot wires everything together and mounts Vue last. -->
  <script src="js/zf-store.js"></script>
  <script src="js/zf-app-shell.js"></script>
  <script src="js/zf-editor-layers.js"></script>
  <script src="js/zf-editor-drawing.js"></script>
  <script src="js/zf-editor.js"></script>
  <script src="js/zf-editor-component.js"></script>
  <script src="js/zf-reader.js"></script>
  <script src="js/zf-sheet.js"></script>
  <script src="js/zf-library-view.js"></script>
  <script src="js/zf-boot.js"></script>
</body>
</html>
