<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine Forge - Make and share zines</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>

  <script src="js/zine-models.js"></script>
  <script src="js/zine-themes.js"></script>
  <script src="js/zine-library.js"></script>
  <script src="js/util.js"></script>
  <script src="js/components/ZineIconPicker.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>

  <template id="zine-app-shell-template">
    <div>
      <header class="zf2-masthead">
        <div class="zf2-masthead-titles">
          <span class="zf2-kicker">Zine &middot; {{ store.view }}</span>
          <h1 class="zf2-title">{{ store.title || 'Untitled Zine' }}</h1>
          <div class="zf2-meta">
            <span v-if="store.author">by {{ store.author }}</span>
            <span v-if="store.author" aria-hidden="true">&middot;</span>
            <span class="zf-save-indicator" v-if="savedLabel" title="Your draft is saved in this browser" aria-live="polite">{{ savedLabel }}</span>
          </div>
        </div>
        <div class="zf2-masthead-actions">
          <button class="zf2-ghost" @click="onUndo" :disabled="!canUndo" title="Undo (Ctrl+Z)">Undo</button>
          <button class="zf2-ghost" @click="onRedo" :disabled="!canRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
          <button class="zf2-ghost" @click="store.settingsOpen = !store.settingsOpen" :aria-expanded="store.settingsOpen" title="Toggle zine settings" aria-haspopup="dialog">
            <iconify-icon icon="ph:gear-six" aria-hidden="true" style="vertical-align:-2px;"></iconify-icon>
            Settings
          </button>
          <button class="zf2-ghost" @click="onNew">New</button>
        </div>
      </header>
      <nav class="zf2-viewtabs" aria-label="Sections">
        <button class="zf2-tab" :aria-current="store.view === 'editor'" @click="goEditor">Editor</button>
        <button class="zf2-tab" :aria-current="store.view === 'reader'" @click="goReader">Read</button>
        <button class="zf2-tab" :aria-current="store.view === 'sheet'" @click="goSheet">Print</button>
        <button class="zf2-tab" :aria-current="store.view === 'library'" @click="goLibrary">Library</button>
      </nav>

      <main class="zf-main">
        <div v-if="store.status" class="zf-muted" role="status" aria-live="polite">{{ store.status }}</div>
        <section v-show="store.view === 'editor'"><zine-editor></zine-editor></section>
        <section v-show="store.view === 'reader'"><zine-reader></zine-reader></section>
        <section v-show="store.view === 'sheet'"><zine-sheet></zine-sheet></section>
        <section v-show="store.view === 'library'"><zine-library></zine-library></section>
      </main>
    </div>
  </template>

  <template id="zine-reader-template">
    <div class="zf-reader">
      <div class="zf-no-print" style="margin-bottom:1rem;">
        <h2 style="margin:0;font-family:var(--zf-serif);">{{ store.title || 'Untitled Zine' }}</h2>
        <div class="zf-muted" v-if="store.author">by {{ store.author }}</div>
      </div>
      <article class="zf-mini-page" v-if="page" :style="Object.assign({}, readerThemeStyle, readerPageStyle)">
        <h2 class="zf-mini-heading" v-if="page.heading">{{ page.heading }}</h2>
        <template v-for="img in (page.images || [])" :key="'r-blk-' + img.id">
          <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
               class="zf-mini-image zf-block-image" :src="img.src" alt="Page illustration"
               :style="readerBlockImageStyleFor(img)" />
          <iconify-icon v-else-if="img.wrap === 'block' && img.kind === 'icon'"
               class="zf-mini-image zf-block-image zf-block-icon" :icon="img.src"
               :style="Object.assign({}, readerBlockImageStyleFor(img), { color: img.color || 'inherit' })"></iconify-icon>
        </template>
        <div class="zf-mini-body" ref="bodyReader" v-html="bodyHtml"></div>
        <template v-for="img in (page.images || [])" :key="'r-free-' + img.id">
          <img v-if="(img.wrap === 'free' || !img.wrap) && img.kind !== 'icon'"
               class="zf-mini-image zf-positioned" :src="img.src" alt="Page illustration"
               :style="readerFreeImageStyleFor(img)" />
          <iconify-icon v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'icon'"
               class="zf-mini-image zf-positioned zf-positioned-icon" :icon="img.src"
               :style="Object.assign({}, readerFreeImageStyleFor(img), { color: img.color || 'inherit' })"></iconify-icon>
        </template>
        <template v-for="box in (page.textBoxes || [])" :key="'r-tb-' + box.id">
          <div class="zf-textbox zf-textbox-readonly" :style="readerTextBoxStyleFor(box)">
            <div class="zf-textbox-content" v-html="box.html"></div>
          </div>
        </template>
      </article>
      <div class="zf-pager zf-no-print">
        <button class="zf-btn" style="border-color:var(--zf-border);" :disabled="currentIndex === 0" @click="prev">&larr; Previous</button>
        <span class="zf-muted">Page {{ currentIndex + 1 }} of {{ total }}</span>
        <button class="zf-btn" style="border-color:var(--zf-border);" :disabled="currentIndex >= total - 1" @click="next">Next &rarr;</button>
      </div>
    </div>
  </template>

  <template id="zine-editor-template">
    <div class="zf-editor">
      <aside>
        <div class="zf-settings-backdrop" v-if="store.settingsOpen" @click="store.settingsOpen = false" aria-hidden="true"></div>
        <div class="zf-settings-slide" :class="{ open: store.settingsOpen }" role="dialog" aria-label="Zine settings" @keydown.esc="store.settingsOpen = false">
          <div class="zf-settings-slide-head">
            <strong>Zine settings</strong>
            <button class="zf-icon-btn" @click="store.settingsOpen = false" aria-label="Close settings">&times;</button>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-model">Zine model</label>
            <select id="zf-zine-model" class="zf-input" :value="store.modelId" @change="onModelChange">
              <option v-for="m in models" :key="m.id" :value="m.id">{{ m.label }}</option>
            </select>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-theme">Theme</label>
            <select id="zf-zine-theme" class="zf-input" :value="store.themeId" @change="onThemeChange">
              <option v-for="t in themes" :key="t.id" :value="t.id">{{ t.label }}</option>
            </select>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-margin">Page margin ({{ store.marginIn }} in)</label>
            <input id="zf-zine-margin" type="range" min="0.04" max="0.35" step="0.01"
                   :value="store.marginIn" @input="store.setMargin($event.target.value)" style="width:100%;" />
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-printer-safety">Printer safe area ({{ store.printerSafetyIn }} in)</label>
            <input id="zf-zine-printer-safety" type="range" min="0" max="0.5" step="0.01"
                   :value="store.printerSafetyIn" @input="store.setPrinterSafety($event.target.value)" style="width:100%;" />
            <div class="zf-muted" style="font-size:0.75rem;margin-top:0.15rem;">Shows where most printers can't reach. Content outside this area may be clipped.</div>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-safe-edge">Edge safety margin ({{ store.safeEdgeIn }} in)</label>
            <input id="zf-zine-safe-edge" type="range" min="0" max="0.75" step="0.01"
                   :value="store.safeEdgeIn" @input="store.setSafeEdge($event.target.value)" style="width:100%;" />
            <div class="zf-muted" style="font-size:0.75rem;margin-top:0.15rem;">Extra padding auto-applied to the outer edge of corner pages so your printer doesn't clip them.</div>
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-title">Zine title</label>
            <input id="zf-zine-title" class="zf-input" v-model="store.title" />
          </div>
          <div class="zf-field">
            <label class="zf-label" for="zf-zine-author">Author</label>
            <input id="zf-zine-author" class="zf-input" v-model="store.author" />
          </div>
        </div>
        <div class="zf-muted" style="margin-bottom:0.5rem;">
          {{ store.pages.length }} page<span v-if="store.pages.length !== 1">s</span> filled
          <span v-if="activeModel"> &middot; this model uses {{ activeModel.pagesPerSheet }} per sheet
            <span v-if="store.pagesNeeded() > store.pages.length"> (add {{ store.pagesNeeded() - store.pages.length }} more to fill a sheet)</span>
          </span>
        </div>
        <div class="zf-fill-hint" v-if="needsToFill > 0">
          This sheet needs <strong>{{ needsToFill }}</strong> more page<span v-if="needsToFill !== 1">s</span> before it will print as a complete zine.
        </div>
        <div class="zf-fill-hint complete" v-else>
          This zine has enough pages for {{ Math.ceil(store.pages.length / activeModel.pagesPerSheet) || 1 }} printed sheet<span v-if="(Math.ceil(store.pages.length / activeModel.pagesPerSheet) || 1) !== 1">s</span>.
        </div>
        <div class="zf-label" style="margin-top:0.75rem;">Pages</div>
        <ul class="zf-page-list">
          <li v-for="(p, i) in store.pages" :key="p.id"
              :class="[{ active: p.id === store.activePageId, 'zf-draggable': true }, dragClass(i)]"
              draggable="true"
              @click="selectPage(p.id)"
              @dragstart="onDragStart($event, i)"
              @dragover="onDragOver($event, i)"
              @dragleave="onDragLeave($event, i)"
              @drop="onDrop($event, i)"
              @dragend="onDragEnd">
            <span style="display:flex;align-items:center;gap:0.25rem;min-width:0;">
              <span class="zf-page-grip" aria-hidden="true" title="Drag to reorder">&#x2261;</span>
              <span class="zf-page-num" :class="{ cover: i === 0, back: i === store.pages.length - 1 && store.pages.length > 1 }">{{ i + 1 }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ pageLabel(p, i) }}<span class="zf-mini" v-if="p.image"> (img)</span></span>
            </span>
            <span class="zf-page-tools">
              <button class="zf-icon-btn" @click.stop="store.duplicatePage(p.id)" title="Duplicate page">+</button>
              <button class="zf-icon-btn" @click.stop="store.deletePage(p.id)" title="Delete page">&times;</button>
            </span>
          </li>
          <li class="zf-page-add" @click="store.addPageOrSheet()" role="button" tabindex="0"
              :title="store.isCurrentSheetFull() ? 'This sheet is full. Add a new sheet.' : 'Add a new page at the end'">
            <span class="zf-page-add-label" v-if="!store.isCurrentSheetFull()">+ Add page</span>
            <span class="zf-page-add-label" v-else>+ Add sheet ({{ activeModel ? activeModel.pagesPerSheet : '' }} pages)</span>
          </li>
        </ul>
        <div style="margin-top:0.5rem;display:flex;gap:0.35rem;flex-wrap:wrap;">
          <button class="zf-btn" style="border-color:var(--zf-border);" @click="fillAllWithLorem" title="Fill every page with sample text">Fill all with lorem</button>
          <button class="zf-btn" style="border-color:var(--zf-border);" @click="clearAllText" title="Clear all page body text">Clear all</button>
        </div>
        <div style="margin-top:0.5rem;display:flex;gap:0.35rem;flex-wrap:wrap;">
          <button class="zf-btn" style="border-color:var(--zf-border);" @click="exportJson" title="Download this zine as a JSON file">Export .json</button>
          <label class="zf-btn" style="border-color:var(--zf-border);cursor:pointer;" title="Load a previously exported .zine.json file">
            Import .json
            <input type="file" accept=".json,application/json" style="display:none;" @change="onImportFile" :key="'imp-' + fileInputKey" />
          </label>
        </div>

        <div class="zf-sidebar-layers">
          <button class="zf-sidebar-section-head" @click="layersOpen = !layersOpen" :aria-expanded="layersOpen">
            <span>Layers <span class="zf-mini">&mdash; {{ layers.length }}</span></span>
            <span aria-hidden="true">{{ layersOpen ? '\u25be' : '\u25b8' }}</span>
          </button>
          <div v-show="layersOpen" class="zf-sidebar-layers-body">
            <div v-if="!layers.length" class="zf-muted" style="font-size:0.8rem;">No objects on this page yet.</div>
            <ul class="zf-layers-list" v-else>
              <li v-for="(layer, li) in layers" :key="layer.id"
                  draggable="true"
                  :class="[{ active: (layer.kind === 'textBox' ? active.activeTextBoxId === layer.id : active.activeImageId === layer.id) }, layerDragClass(li)]"
                  @click="selectLayer(layer)"
                  @dragstart="onLayerDragStart($event, li)"
                  @dragover="onLayerDragOver($event, li)"
                  @dragleave="onLayerDragLeave($event, li)"
                  @drop="onLayerDrop($event, li)"
                  @dragend="onLayerDragEnd">
                <iconify-icon class="zf-layer-ico"
                  :icon="layer.kind === 'textBox' ? 'ph:text-t' : (layer.kind === 'icon' ? 'ph:star' : 'ph:image')"
                  aria-hidden="true"></iconify-icon>
                <span class="zf-layer-label">{{ layerLabel(layer) }}</span>
                <span class="zf-layer-tools">
                  <button class="zf-icon-btn" @click.stop="toggleLayerHidden(layer)" :title="layer.el.hidden ? 'Show layer' : 'Hide layer'" :aria-label="layer.el.hidden ? 'Show layer' : 'Hide layer'">
                    <iconify-icon :icon="layer.el.hidden ? 'ph:eye-slash' : 'ph:eye'" aria-hidden="true"></iconify-icon>
                  </button>
                  <button class="zf-icon-btn" @click.stop="removeLayer(layer)" title="Delete layer" aria-label="Delete layer">&times;</button>
                </span>
              </li>
            </ul>
          </div>
        </div>
      </aside>

      <div class="zf-canvas-col">
        <div class="zf-canvas-empty-hint" v-if="isEmptyPage(active)">
          Start your page: type a heading, then write below. Use the tools on the right to add an image, icon, or text box.
        </div>
        <div class="zf-canvas-wrap">
          <div class="zf-ghost-page zf-ghost-prev" v-if="prevPage" role="button" tabindex="0"
               @click="goToPageId(prevPage.id)" @keydown.enter="goToPageId(prevPage.id)"
               :title="'Go to ' + (prevPage.heading || 'previous page')">
            <span class="zf-ghost-label">Page {{ activeIndex }}</span>
            <div class="zf-ghost-title">{{ prevPage.heading || 'Untitled' }}</div>
            <div class="zf-ghost-snippet">{{ ghostSnippet(prevPage) }}</div>
          </div>
          <div class="zf-page zf-mini-page" ref="miniPage" :style="Object.assign({}, pageStyle, pageThemeStyle)">
            <template v-for="g in safeGuides" :key="g.key">
              <div class="zf-mini-safe-guide" :style="g.style"></div>
            </template>
            <input class="zf-mini-heading" v-model="active.heading" placeholder="Page heading" maxlength="80" />
            <template v-for="img in (active.images || [])" :key="'blk-' + img.id">
              <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                   class="zf-mini-image zf-block-image"
                   :src="img.src" alt="Page illustration"
                   :style="imageBlockStyle(img)" />
              <iconify-icon v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                   class="zf-mini-image zf-block-image zf-block-icon"
                   :icon="img.src"
                   :style="Object.assign({}, imageBlockStyle(img), { color: img.color || 'inherit' })"></iconify-icon>
            </template>
            <div class="zf-mini-body zf-editable"
                 ref="bodyEditor"
                 :key="active.id"
                 contenteditable="true"
                 @input="onBodyInput"
                 @paste="onBodyPaste"
                 @focus="clearElementSelection"
                 @mousedown="clearElementSelection"
                 data-placeholder="Write your zine page here..."></div>

            <template v-for="box in (active.textBoxes || [])" :key="'tb-' + box.id">
              <div v-if="!box.hidden" class="zf-textbox"
                   tabindex="0"
                   :class="{ 'zf-textbox-selected': active.activeTextBoxId === box.id }"
                   :data-zf-text-id="box.id"
                   :style="textStyle(box)"
                   @mousedown="onTextBoxMouseDown($event, box)"
                   @click.stop="selectTextBox(box)"
                   @keydown="onTextBoxKeydown($event, box)">
                <div class="zf-textbox-content"
                     :data-zf-text-content-id="box.id"
                     contenteditable="true"
                     @input="onTextBoxInput($event, box)"
                     @mousedown.stop></div>
                <span class="zf-img-handle zf-img-handle-resize"
                      title="Drag to resize (scales text)"
                      @mousedown.stop.prevent="onTextBoxResizeStartScaled($event, box)"></span>
                <span class="zf-img-handle zf-img-handle-rotate"
                      title="Drag to rotate"
                      @mousedown.stop.prevent="onTextBoxRotateStart($event, box)"></span>
              </div>
            </template>

            <template v-for="img in (active.images || [])" :key="'ovl-' + img.id">
              <div v-if="(img.wrap === 'free' || !img.wrap) && !img.hidden"
                   class="zf-img-wrap"
                   tabindex="0"
                   :class="{ 'zf-img-selected': active.activeImageId === img.id, 'zf-image-dragging': imageDrag && imageDrag.imgId === img.id }"
                   :style="Object.assign({}, imageStyle(img), (img.kind === 'icon' ? { fontSize: ((img.w || 0.6) * 96 * imageScale * 0.85) + 'px' } : {}))"
                   @mousedown="onImageMouseDownItem($event, img)"
                   @click.stop="selectImage(img)"
                   @keydown.delete.prevent="deleteSelectedElement"
                   @keydown.backspace.prevent="deleteSelectedElement">
                 <img v-if="img.kind !== 'icon'" :src="img.src" alt="Page illustration" />
                 <iconify-icon v-else class="zf-icon-element" :icon="img.src" :style="{ width: '100%', height: '100%', color: img.color || 'inherit' }"></iconify-icon>
                <span class="zf-img-handle zf-img-handle-resize"
                      title="Drag to resize"
                      @mousedown.stop.prevent="onResizeStart($event, img)"></span>
                <span class="zf-img-handle zf-img-handle-rotate"
                      title="Drag to rotate"
                      @mousedown.stop.prevent="onRotateStart($event, img)"></span>
              </div>
            </template>
          </div>
          <div class="zf-ghost-page zf-ghost-next" v-if="nextPage" role="button" tabindex="0"
               @click="goToPageId(nextPage.id)" @keydown.enter="goToPageId(nextPage.id)"
               :title="'Go to ' + (nextPage.heading || 'next page')">
            <span class="zf-ghost-label">Page {{ activeIndex + 2 }}</span>
            <div class="zf-ghost-title">{{ nextPage.heading || 'Untitled' }}</div>
            <div class="zf-ghost-snippet">{{ ghostSnippet(nextPage) }}</div>
          </div>
        </div>
        <zine-icon-picker
          :open="iconPickerOpen"
          @select="addIcon"
          @close="closeIconPicker"></zine-icon-picker>

        <div class="zf-budget" :class="budgetClass" v-if="budget">
          <div class="zf-budget-row">
            <span class="zf-budget-num">{{ wordCount }} / {{ budget.words }} words</span>
            <span class="zf-budget-num">{{ lineCount }} / {{ budget.lines }} lines</span>
            <span class="zf-budget-num">{{ charCount }} / {{ budget.chars }} chars</span>
          </div>
          <div class="zf-budget-bar" :class="barClass" style="margin-top:0.35rem;">
            <div :style="{ width: barWidth }"></div>
          </div>
          <div v-if="worstPct >= 100" style="margin-top:0.25rem;">
            This page is over the space budget for a {{ activeModel.page.width }}x{{ activeModel.page.height }} {{ activeModel.page.unit }} mini-page. Trim text or split across pages.
          </div>
          <div v-else-if="worstPct >= 85" style="margin-top:0.25rem;">
            Getting close to the space limit for this mini-page.
          </div>
        </div>
      </div>

      <aside class="zf-rail" aria-label="Formatting and insert tools">
        <div class="zf-rail-group" role="toolbar" aria-label="Text formatting">
          <button type="button" class="zf-rail-btn" title="Bold (Ctrl+B)" aria-label="Bold" @mousedown.prevent @click="execCmdOnActive('bold')"><b>B</b></button>
          <button type="button" class="zf-rail-btn" title="Italic (Ctrl+I)" aria-label="Italic" @mousedown.prevent @click="execCmdOnActive('italic')"><i>I</i></button>
          <button type="button" class="zf-rail-btn" title="Underline (Ctrl+U)" aria-label="Underline" @mousedown.prevent @click="execCmdOnActive('underline')"><u>U</u></button>
          <label class="zf-rail-btn zf-rail-color" title="Text or element color" aria-label="Color" @mousedown.prevent>
            <iconify-icon icon="ph:palette" aria-hidden="true"></iconify-icon>
            <input type="color" value="#1b1b1b" @mousedown.prevent @input="applyColor($event.target.value)" aria-label="Choose color" />
          </label>
          <button type="button" class="zf-rail-btn" title="Reset to theme color" aria-label="Reset color" @click="resetColor">
            <iconify-icon icon="ph:arrow-counter-clockwise" aria-hidden="true"></iconify-icon>
          </button>
          <label class="zf-rail-font-wrap" title="Font">
            <iconify-icon icon="ph:text-aa" aria-hidden="true"></iconify-icon>
            <select class="zf-rail-font" @change="applyFont($event.target.value)" aria-label="Font">
              <option value="">Font</option>
              <option value="Georgia, 'Times New Roman', serif">Georgia</option>
              <option value="'Iowan Old Style', Palatino, Georgia, serif">Palatino</option>
              <option value="'Times New Roman', Times, serif">Times</option>
              <option value="'Public Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">Public Sans</option>
              <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica</option>
              <option value="'Courier New', Courier, monospace">Courier</option>
              <option value="Impact, 'Arial Black', sans-serif">Impact</option>
            </select>
          </label>
        </div>
        <div class="zf-rail-sep" aria-hidden="true"></div>
        <div class="zf-rail-group" role="toolbar" aria-label="Add elements">
          <label class="zf-rail-btn" title="Add an image" aria-label="Add image">
            <iconify-icon icon="ph:image" aria-hidden="true"></iconify-icon>
            <input :key="fileInputKey" type="file" accept="image/*" style="display:none;" @change="onImageChange" />
          </label>
          <button type="button" class="zf-rail-btn" @click="addTextBox" title="Add a text box" aria-label="Add text box">
            <iconify-icon icon="ph:text-t" aria-hidden="true"></iconify-icon>
          </button>
          <button type="button" class="zf-rail-btn" @click="openIconPicker" title="Add an icon" aria-label="Add icon">
            <iconify-icon icon="ph:star" aria-hidden="true"></iconify-icon>
          </button>
        </div>
        <div class="zf-rail-group" role="toolbar" aria-label="Selected element actions">
          <button type="button" class="zf-rail-btn" @click="copySelected" title="Copy selected element (Ctrl+C)" aria-label="Copy selected element">

            <button class="zf-btn" style="border-color:var(--zf-border);" @click="bringForward" title="Move this text box forward one step">Forward</button>
            <button class="zf-btn" style="border-color:var(--zf-border);" @click="sendBackward" title="Move this text box backward one step">Backward</button>

  <script>
    // Logs to the console always. Adds a small debug panel to the page
    // only when the URL hash includes #zfdebug, so it never ships visible.
    // (zfLog moved to /js/util.js)
    window.onerror = function (msg, src, line, col, err) {
      zfLog('ERROR: ' + msg + ' @ ' + src + ':' + line + ':' + col);
    };
    window.addEventListener('unhandledrejection', function (e) {
      zfLog('REJECTION: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });

    // ---- store ----
    var STORAGE_KEY = 'zine-forge-draft-v1';
    function zfEmptyPage() {
      return {
        id: 'p' + Math.random().toString(36).slice(2, 9),
        heading: '',
        body: '',
        images: [],
        textBoxes: []
      };
    }
    // Build store pages from a zine file's pages array. Accepts both the
    // rich export format (images[]/textBoxes[]) and the older single-image
    // format (image/imageX/imageY/...), normalizing to the rich shape.
    // Shared by file import, the shared-link loader, and the examples loader.
    function zfBuildPagesFromData(pages) {
      if (!Array.isArray(pages)) return [zfEmptyPage()];
      var built = pages.map(function (p, i) {
        var page = {
          id: 'p' + i + '-' + Math.random().toString(36).slice(2, 7),
          heading: p.heading || '',
          body: p.body || '',
          image: p.image || '',
          imageX: typeof p.imageX === 'number' ? p.imageX : 0,
          imageY: typeof p.imageY === 'number' ? p.imageY : 0,
          imageW: typeof p.imageW === 'number' ? p.imageW : 1.5,
          imageRot: typeof p.imageRot === 'number' ? p.imageRot : 0,
          imageWrap: p.imageWrap || 'free'
        };
        var imgs = [];
        if (Array.isArray(p.images)) imgs = imgs.concat(p.images);
        if (Array.isArray(p.icons)) imgs = imgs.concat(p.icons);
        // Export writes icons in BOTH images[] (with kind) and a separate
        // icons[] array. Merge them but drop duplicates by id so each icon
        // appears once (preferring the images[] copy that carries kind).
        var seenIds = {};
        imgs = imgs.filter(function (im) {
          if (!im || !im.id) return true;
          if (seenIds[im.id]) return false;
          seenIds[im.id] = true;
          return true;
        });
        page.images = imgs.map(function (im) {
          return {
            id: im.id || ('i-' + Math.random().toString(36).slice(2, 8)),
            src: im.src,
            kind: im.kind || 'photo',
            x: typeof im.x === 'number' ? im.x : 0,
            y: typeof im.y === 'number' ? im.y : 0,
            w: typeof im.w === 'number' ? im.w : 1.5,
            rot: typeof im.rot === 'number' ? im.rot : 0,
            wrap: im.wrap || 'free',
            z: typeof im.z === 'number' ? im.z : 0,
            color: im.color || '',
            hidden: !!im.hidden
          };
        });
        page.textBoxes = Array.isArray(p.textBoxes) ? p.textBoxes.map(function (tb) {
          return {
            id: tb.id || ('t-' + Math.random().toString(36).slice(2, 8)),
            html: tb.html || '',
            x: typeof tb.x === 'number' ? tb.x : 0,
            y: typeof tb.y === 'number' ? tb.y : 0,
            w: typeof tb.w === 'number' ? tb.w : 1.8,
            rot: typeof tb.rot === 'number' ? tb.rot : 0,
            fontSize: typeof tb.fontSize === 'number' ? tb.fontSize : 1.0,
            z: typeof tb.z === 'number' ? tb.z : 0,
            color: tb.color || '',
            hidden: !!tb.hidden
          };
        }) : [];
        if (window.zfMigratePage) window.zfMigratePage(page);
        return page;
      });
      return built.length ? built : [zfEmptyPage()];
    }
    // Apply a parsed zine object (from a file, URL, or share link) to the
    // store. Returns true on success. Shared by import and example loading.
    function zfApplyZineData(parsed) {
      if (!parsed || !Array.isArray(parsed.pages)) return false;
      store.title = parsed.title || 'Untitled Zine';
      store.author = parsed.author || '';
      if (parsed.modelId && window.ZFModels) store.modelId = parsed.modelId;
      if (parsed.themeId && window.ZFThemes) store.themeId = parsed.themeId;
      if (typeof parsed.marginIn === 'number') store.marginIn = parsed.marginIn;
      store.pages = zfBuildPagesFromData(parsed.pages);
      store.activePageId = store.pages[0].id;
      return true;
    }
    // Fetch and load a bundled example zine (file name relative to /zines/).
    // Global so any component (editor rail, library) can trigger it.
    function zfLoadExample(file) {
      store.status = 'Loading example...';
      return fetch('zines/' + file)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (parsed) {
          if (!zfApplyZineData(parsed)) throw new Error('Bad zine file');
          store.view = 'editor';
          store.status = 'Loaded example: ' + (parsed.title || file);
          setTimeout(function () {
            if (store.status.indexOf('Loaded example') === 0) store.status = '';
          }, 2500);
          return true;
        })
        .catch(function (e) {
          store.status = 'Could not load example: ' + e.message;
          return false;
        });
    }
    // -------- Image dimension cache --------
    // Cache natural sizes keyed by data URL so we don't decode repeatedly.
    // (ZF_IMG_CACHE and zfGetImageSize moved to /js/util.js)

    // Inject a flow-mode spacer + image into a body-like container.
    // container: the element (usually the body div)
    // page: the page record
    // pxPerIn: screen pixels per physical inch
    // bodyWIn, bodyHIn: the body box dimensions in inches
    // zfInjectMergedFlow takes an ARRAY of flow-mode img objects and injects
    // a SINGLE spacer with a multi-notched shape-outside polygon that text
    // flows around. Also injects each image (positioned absolutely) so the
    // visible picture sits inside the empty region of the polygon.
    // This replaces the old per-image zfInjectFlow approach which could not
    // handle multiple flow images (floats stack instead of merging).
    function zfInjectMergedFlow(container, imgs, pxPerIn, bodyWIn, bodyHIn, opts) {
      if (!container || !imgs || !imgs.length) return;
      opts = opts || {};
      // Strip all previous flow injections (spacers, wraps, imgs).
      var old = container.querySelectorAll(
        '[data-zf-spacer="1"], [data-zf-flow-img="1"], [data-zf-flow-wrap="1"]'
      );
      for (var i = 0; i < old.length; i++) old[i].remove();

      // Build a list of rectangles (in inches) for each visible image, and
      // also the pixel size needed for rendering each img.
      var rects = [];   // { id, xL, yT, xR, yB, side, img, imgW, imgH, rot }
      var pending = imgs.length;
      if (!pending) return;

      for (var k = 0; k < imgs.length; k++) {
        (function (img) {
          zfGetImageSize(img.src, function (size) {
            var aspect = (size.w && size.h) ? (size.w / size.h) : 1.33;
            var w = (typeof img.w === 'number') ? img.w : 1.5;
            var h = w / aspect;
            var rot = (typeof img.rot === 'number') ? img.rot : 0;
            var xIn = (typeof img.x === 'number') ? img.x : 0;
            var yIn = (typeof img.y === 'number') ? img.y : 0;
            var rad = rot * Math.PI / 180;
            var cosA = Math.abs(Math.cos(rad));
            var sinA = Math.abs(Math.sin(rad));
            var bbW = w * cosA + h * sinA;
            var bbH = w * sinA + h * cosA;
            var cx = xIn + w / 2;
            var cy = yIn + h / 2;
            var bbX = Math.max(0, cx - bbW / 2);
            var bbY = Math.max(0, cy - bbH / 2);
            var bbRight = Math.min(bodyWIn, bbX + bbW);
            var bbBottom = Math.min(bodyHIn, bbY + bbH);
            var side = (cx < bodyWIn / 2) ? 'left' : 'right';
            rects.push({
              id: img.id || ('anon-' + Math.random().toString(36).slice(2, 6)),
              img: img,
              xL: bbX / bodyWIn,
              xR: bbRight / bodyWIn,
              yT: Math.max(0, bbY / bodyHIn),
              yB: Math.min(1, bbBottom / bodyHIn),
              side: side,
              imgW: w,
              imgH: h,
              rot: rot,
              xIn: xIn,
              yIn: yIn
            });
            pending--;
            if (pending === 0) {
              finalizeMergedFlow(container, rects, pxPerIn, opts);
            }
          });
        })(imgs[k]);
      }
    }

    function finalizeMergedFlow(container, rects, pxPerIn, opts) {
      if (!rects.length) return;
      // Sort by yT for stable polygon tracing.
      rects.sort(function (a, b) { return a.yT - b.yT; });

      // For the shape-outside polygon we need to trace a boundary that
      // excludes every rectangle. Simplification: assign each rect to a side
      // based on its center x. Then trace:
      //   For all-left rects, notch in from the left edge.
      //   For all-right rects, notch in from the right edge.
      // Mixed rects are supported by tracing a staircase on both edges.
      var leftRects = [];
      var rightRects = [];
      for (var i = 0; i < rects.length; i++) {
        if (rects[i].side === 'left') leftRects.push(rects[i]);
        else rightRects.push(rects[i]);
      }
      // Enforce at most one notch per side (same-side rects would produce a
      // self-intersecting polygon, which browsers silently reject). Keep the
      // rect closer to its own edge and drop the rest.
      leftRects.sort(function (a, b) { return a.xL - b.xL; });   // closest to left first
      rightRects.sort(function (a, b) { return b.xR - a.xR; });  // closest to right first
      if (leftRects.length > 1) leftRects = [leftRects[0]];
      if (rightRects.length > 1) rightRects = [rightRects[0]];
      leftRects.sort(function (a, b) { return a.yT - b.yT; });
      rightRects.sort(function (a, b) { return a.yT - b.yT; });

      // Safety clamp: if a single notch would occupy more than 70% of the
      // body width, shrink it so text always has at least 30% of the width
      // to flow. This prevents "text completely disappears" when the image
      // is large or centered.
      function clampNotchLeft(rect) {
        var minX = 0.3; // right edge of notch must leave at least 30% width
        if (rect.xR > 1 - minX) rect.xR = 1 - minX;
      }
      function clampNotchRight(rect) {
        var minX = 0.3;
        if (rect.xL < minX) rect.xL = minX;
      }
      for (var ci = 0; ci < leftRects.length; ci++) clampNotchLeft(leftRects[ci]);
      for (var cj = 0; cj < rightRects.length; cj++) clampNotchRight(rightRects[cj]);

      // Build polygon: start top-left, go clockwise around the bounding box,
      // but jog inward on the left edge for left-side notches and inward on
      // the right edge for right-side notches. Since at most one notch per
      // side, this is a simple 6- to 8-vertex polygon.
      var pts = [];
      pts.push('0% 0%');
      pts.push('100% 0%');
      // Right edge, top to bottom, with at most one notch
      if (rightRects.length) {
        var rr = rightRects[0];
        pts.push(pct(1) + '% ' + pct(rr.yT) + '%');
        pts.push(pct(rr.xL) + '% ' + pct(rr.yT) + '%');
        pts.push(pct(rr.xL) + '% ' + pct(rr.yB) + '%');
        pts.push(pct(1) + '% ' + pct(rr.yB) + '%');
      }

    // Legacy: single-image injector. Kept for callers that haven't been

    function zfInjectFlow(container, img, pxPerIn, bodyWIn, bodyHIn, opts) {

          '[data-zf-spacer="1"][data-zf-img-id="' + thisId + '"], ' +
          '[data-zf-flow-img="1"][data-zf-img-id="' + thisId + '"], ' +

        var aspect = (size.w && size.h) ? (size.w / size.h) : 1.33;

        var imgW = w;
        var imgH = w / aspect;

        var xIn = (typeof img.x === 'number') ? img.x : 0;
        var yIn = (typeof img.y === 'number') ? img.y : 0;

        var sinA = Math.abs(Math.sin(rad));

        var bbH = imgW * sinA + imgH * cosA;
        var cx = xIn + imgW / 2;
        var cy = yIn + imgH / 2;
        var bbX = Math.max(0, cx - bbW / 2);
        var bbY = Math.max(0, cy - bbH / 2);
        var bbRight = Math.min(bodyWIn, bbX + bbW);
        var bbBottom = Math.min(bodyHIn, bbY + bbH);

        var xL = Math.max(0, (bbX / bodyWIn) * 100);
        var xR = Math.min(100, (bbRight / bodyWIn) * 100);
        var yT = Math.max(0, (bbY / bodyHIn) * 100);
        var yB = Math.min(100, (bbBottom / bodyHIn) * 100);

            xL.toFixed(2) + '% ' + yB.toFixed(2) + '%'

          'left: ' + (xIn * pxPerIn) + 'px;' +

          'width: ' + (imgW * pxPerIn) + 'px;' +

          'transform: rotate(' + rot + 'deg);' +

            var startY = evt.clientY;

            var baseY = (typeof img.y === 'number') ? img.y : 0;

              window.removeEventListener('mousemove', move);
              window.removeEventListener('mouseup', up);

            }

            window.addEventListener('mouseup', up);
          });

              borderBottom: '1px dashed ' + dashColor

            out.push({ key: 'bottom', style: {
              left: '0', right: '0', bottom: '0',
              height: safetyPx + 'px',
              borderTop: '1px dashed ' + dashColor
            }});
          }
          if (localLeft) {
            out.push({ key: 'left', style: {
              top: '0', bottom: '0', left: '0',
              width: safetyPx + 'px',
              borderRight: '1px dashed ' + dashColor
            }});
          }

    function zfRelativeTime(ts) {
      if (!ts) return '';

      var min = Math.floor(d / 60000);

      if (min < 60) return min + 'm ago';
      var hr = Math.floor(min / 60);
      if (hr < 24) return hr + 'h ago';
      var day = Math.floor(hr / 24);
      if (day < 30) return day + 'd ago';
      return new Date(ts).toLocaleDateString();

        if (document.visibilityState === 'hidden') flushSave();
      });
      window.addEventListener('pagehide', flushSave);
      window.addEventListener('beforeunload', flushSave);

      // Keyboard shortcuts for undo/redo. Skip when focus is inside an
      // input/textarea/contenteditable so users get normal browser undo
      // while typing (which is not what we want for structure changes but
      // is what they'd expect for text).
      window.addEventListener('keydown', function (evt) {
        var cmd = evt.ctrlKey || evt.metaKey;
        var key = (evt.key || '').toLowerCase();
        // Skip our shortcuts when the user is typing inside an editable.
        // Let the browser handle native text editing (Backspace, Ctrl+Z, etc.)
        var active = document.activeElement;
        var inEditable = active && (
          active.isContentEditable ||
          active.tagName === 'INPUT' ||
          active.tagName === 'TEXTAREA'
        );

        // Undo/redo
        if (cmd && !inEditable) {
          if (key === 'z' && !evt.shiftKey) {
            evt.preventDefault();
            if (window.ZFUndo) window.ZFUndo();
            return;
          } else if ((key === 'z' && evt.shiftKey) || key === 'y') {
            evt.preventDefault();
            if (window.ZFRedo) window.ZFRedo();
            return;
          } else if (key === 'd') {
            // Ctrl+D / Cmd+D: duplicate selected element
            evt.preventDefault();
            if (window.ZFEditorActions && window.ZFEditorActions.duplicate) {
              window.ZFEditorActions.duplicate();
            }
            return;
          } else if (key === 'c') {
            // Ctrl+C / Cmd+C: copy the selected element. Only intercept when
            // an element is selected, so copying actual text still works.
            if (window.ZFEditorActions && window.ZFEditorActions.hasSelection && window.ZFEditorActions.hasSelection()) {
              evt.preventDefault();
              window.ZFEditorActions.copy();
            }
            return;
          } else if (key === 'v') {
            // Ctrl+V / Cmd+V: paste the buffered element.
            if (window.zfClipboard && window.ZFEditorActions && window.ZFEditorActions.paste) {
              evt.preventDefault();
              window.ZFEditorActions.paste();
            }
            return;
          }
        }

        // Delete / Backspace: remove selected element (only when not editing).
        if ((evt.key === 'Delete' || evt.key === 'Backspace') && !inEditable) {
          // Only act if something is selected (an image or text box).
          if (window.ZFEditorActions && window.ZFEditorActions.hasSelection && window.ZFEditorActions.hasSelection()) {
            evt.preventDefault();
            window.ZFEditorActions.delete();
          }
        }
      });

    // -------- Undo / redo --------
    // Snapshot-based history: keeps the last N "meaningful" states of the
    // zine. A state is captured on a debounce whenever the content changes
    // (same signal the autosave loop uses). This is simple and covers every
    // kind of edit (text, images, text boxes, page ops, model/theme changes).
    var ZF_HISTORY_MAX = 40;
    var zfHistory = [];       // past states, oldest first
    var zfRedo = [];          // future states (after undo)
    var zfLastSnapStr = '';   // last captured state, to detect changes
    var zfSnapTimer = null;
    var zfApplying = false;   // set during undo/redo to suppress snapshots

    function zfCaptureState() {
      return {
        title: store.title,
        author: store.author,
        modelId: store.modelId,
        themeId: store.themeId,
        marginIn: store.marginIn,
        pages: JSON.parse(JSON.stringify(store.pages))
      };
    }

    function zfApplyState(snap) {
      zfApplying = true;
      store.title = snap.title;
      store.author = snap.author;
      store.modelId = snap.modelId;
      store.themeId = snap.themeId;
      store.marginIn = snap.marginIn;
      store.pages = snap.pages.map(function (p) {
        // Ensure optional arrays exist.
        if (!Array.isArray(p.images)) p.images = [];
        if (!Array.isArray(p.textBoxes)) p.textBoxes = [];
        return p;
      });
      if (!store.pages.length) store.pages = [zfEmptyPage()];
      if (!store.pages.find(function (p) { return p.id === store.activePageId; })) {
        store.activePageId = store.pages[0].id;
      }
      zfApplying = false;
      zfLastSnapStr = JSON.stringify(zfCaptureState());
    }

    function zfCommitHistory() {
      // Called from the autosave loop when content has changed. Snapshots the
      // PREVIOUS state (zfLastSnapStr) into history, then updates lastSnap.
      if (zfApplying) return;
      var current = zfCaptureState();
      var currentStr = JSON.stringify(current);
      if (currentStr === zfLastSnapStr) return;
      if (zfLastSnapStr) {
        try {
          zfHistory.push(JSON.parse(zfLastSnapStr));
          if (zfHistory.length > ZF_HISTORY_MAX) zfHistory.shift();
          zfRedo.length = 0;
        } catch (e) { /* ignore */ }
      }
      zfLastSnapStr = currentStr;
    }

    function zfUndo() {
      if (!zfHistory.length) { store.status = 'Nothing to undo.'; return; }
      var current = zfCaptureState();
      var prev = zfHistory.pop();
      zfRedo.push(current);
      zfApplyState(prev);
      store.status = 'Undo.';
      setTimeout(function () { if (store.status === 'Undo.') store.status = ''; }, 1200);
    }

    function zfRedoAction() {
      if (!zfRedo.length) { store.status = 'Nothing to redo.'; return; }
      var next = zfRedo.pop();
      zfHistory.push(zfCaptureState());
      zfApplyState(next);
      store.status = 'Redo.';
      setTimeout(function () { if (store.status === 'Redo.') store.status = ''; }, 1200);
    }

    // Seed the initial snapshot so we have a baseline.
    zfLastSnapStr = JSON.stringify(zfCaptureState());

    // Autosave loop: writes the current draft slot and, if the zine has an
    // id, mirrors it into the local library. Also drives the undo history.
    setInterval(function () {
      var snap = JSON.stringify({
        t: store.title, a: store.author, m: store.modelId, th: store.themeId,
        p: store.pages
      });
      if (snap !== store._zfLastAutoSave) {
        // Check whether it's actually different from the last snapshot.
        // zfCommitHistory handles this internally using its own tracker.
        zfCommitHistory();
        store._zfLastAutoSave = snap;
        store.saveDraft();
        if (store.currentZineId) store.saveToLibrary();
      }
    }, 1500);

    // Expose for buttons and keyboard handlers.
    window.ZFUndo = zfUndo;
    window.ZFRedo = zfRedoAction;
    window.ZFCanUndo = function () { return zfHistory.length > 0; };
    window.ZFCanRedo = function () { return zfRedo.length > 0; };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
