                 '    margin: 0 !important;\n' +
                 '    padding: 0 !important;\n' +
                 '    transform: none !important;\n' +
                 '    overflow: visible !important;\n' +
                 '  }\n' +
                 '  /* Lock the sheet aspect ratio to the paper so nothing gets\n' +
                 '     squished if the browser overrides our page size. */\n' +
                 '  .zf-sheet, .zf-slot, .zf-mini-page {\n' +
                 '    aspect-ratio: auto;\n' +
                 '  }\n' +
                 '}\n';
        },
        slots: function () {
          var m = this.model;
          if (!m || !window.ZFModels) return [];
          return m.slots.map(function (slot) {
            var rect = window.ZFModels.slotRect(m, slot);
            var page = store.pages[slot.page - 1];
            // Compute a page scale for this slot: slot is 1 column wide.
            // The slot's rendered width is (sheetWidthPx / cols). The physical
            // mini-page width in CSS px is (page width in inches * 96).
            // But since the sheet is landscape and slots sit rotated, keep it
            // simple: scale by (sheetRenderedWidthPx / cols) / physicalPageWidthPx.
            var unit = m.page.unit || 'in';
            var pageInchesW = unit === 'mm' ? m.page.width / 25.4 : m.page.width;
            var physicalCssW = pageInchesW * 96;
            // sheet is fixed at 560 tall by display height; width follows aspect.
            var sheetHeight = 560;
            var aspect = m.paper.width / m.paper.height;
            var sheetWidth = sheetHeight * aspect;
            var grid = window.ZFModels.gridSize(m);
            var slotRenderedW = sheetWidth / grid.cols;
            var slotScale = slotRenderedW / physicalCssW;
            return {
              key: 's-' + slot.page,
              pageNum: slot.page,
              rotation: slot.rotation,
              rect: rect,
              page: page,
              isEmpty: !page || (!page.heading && !page.body && !page.image),
              pageScale: slotScale,
              pageMargin: store.marginIn + 'in',
              bodyHtml: page ? (page.body || '') : ''
            };
          });
        }
      },
      methods: {
        slotBlockImageStyleFor: function (img, s) {
          var m = this.model;
          if (!m || !img || !img.src) return {};
          var px = 96 * (s.pageScale || 1);
          var w = (typeof img.w === "number" ? img.w : 1.5);
          var rot = (typeof img.rot === "number" ? img.rot : 0);
          return {
            width: (w * px) + "px",
            maxWidth: "100%",
            marginBottom: "0.5rem",
            transform: "rotate(" + rot + "deg)",
            transformOrigin: "center center"
          };
        },
        slotFreeImageStyleFor: function (img, s) {
          var m = this.model;
          if (!m || !img || !img.src) return {};
          var px = 96 * (s.pageScale || 1);
          var margin = store.marginIn;
          var x = (typeof img.x === "number" ? img.x : 0) + margin;
          var y = (typeof img.y === "number" ? img.y : 0) + margin;
          var w = (typeof img.w === "number" ? img.w : 1.5);
          var rot = (typeof img.rot === "number" ? img.rot : 0);
          return {
            left: (x * px) + "px",
            top: (y * px) + "px",
            width: (w * px) + "px",
            transform: "rotate(" + rot + "deg)",
            transformOrigin: "center center"
          };
        },
        slotTextBoxStyleFor: function (box, s) {
          var m = this.model;
          if (!m || !box) return {};
          var px = 96 * (s.pageScale || 1);
          var margin = store.marginIn;
          var x = (typeof box.x === "number" ? box.x : 0) + margin;
          var y = (typeof box.y === "number" ? box.y : 0) + margin;
          var w = (typeof box.w === "number" ? box.w : 1.8);
          var rot = (typeof box.rot === "number" ? box.rot : 0);
          var fontSize = (typeof box.fontSize === "number" ? box.fontSize : 1.0);
          return {
            position: "absolute",
            left: (x * px) + "px",
            top: (y * px) + "px",
            width: (w * px) + "px",
            transform: "rotate(" + rot + "deg)",
            transformOrigin: "center center",
            fontSize: (fontSize * 100) + "%"
          };
        },
        slotBlockImageStyle: function (s) {
          // Legacy fallback for old single-image pages.
          var m = this.model;
          if (!m || !s || !s.page || !s.page.image) return {};
          var px = 96 * (s.pageScale || 1);
          var w = (typeof s.page.imageW === "number" ? s.page.imageW : 1.5);
          var rot = (typeof s.page.imageRot === "number" ? s.page.imageRot : 0);
          return {
            width: (w * px) + "px",
            maxWidth: "100%",
            marginBottom: "0.5rem",
            transform: "rotate(" + rot + "deg)",
            transformOrigin: "center center"
          };
        },
        slotFreeImageStyle: function (s) {
          // Legacy fallback for old single-image pages.
          var m = this.model;
          if (!m || !s || !s.page || !s.page.image) return {};
          var px = 96 * (s.pageScale || 1);
          var margin = store.marginIn;
          var x = (typeof s.page.imageX === "number" ? s.page.imageX : 0) + margin;
          var y = (typeof s.page.imageY === "number" ? s.page.imageY : 0) + margin;
          var w = (typeof s.page.imageW === "number" ? s.page.imageW : 1.5);
          var rot = (typeof s.page.imageRot === "number" ? s.page.imageRot : 0);
          return {
            left: (x * px) + "px",
            top: (y * px) + "px",
            width: (w * px) + "px",
            transform: "rotate(" + rot + "deg)"
          };
        },
        sheetInjectFlows: function () {
          var self = this;
          this.$nextTick(function () {
            self._attemptSheetInject(0);
          });
        },
        _attemptSheetInject: function (attempt) {
          var self = this;
          if (attempt > 20) return;
          // Only retry while the sheet view is actually active.
          if (store.view !== "sheet") return;
          var root = self.$el;
          if (!root) { self._schedSheetRetry(attempt); return; }
          var bodies = root.querySelectorAll('.zf-mini-body[data-slot-page]');
          if (!bodies.length) { self._schedSheetRetry(attempt); return; }
          // Check if the sheet is visible yet (first body should have size)
          var firstRect = bodies[0].getBoundingClientRect();
          if (firstRect.width < 20 || firstRect.height < 20) {
            self._schedSheetRetry(attempt);
            return;
          }
          // TEMPORARY: legacy single-image path. Will be replaced by the
          // multi-image loop in a subsequent step.
          for (var i = 0; i < bodies.length; i++) {
            var el = bodies[i];
            var pageNum = Number(el.getAttribute('data-slot-page'));
            var page = store.pages[pageNum - 1];
            if (!page) continue;
            var stale = el.querySelectorAll('[data-zf-spacer="1"], [data-zf-flow-img="1"]');
            for (var k = 0; k < stale.length; k++) stale[k].remove();
            // Support both old (page.image) and new (page.images) shape.
            var flowImgs = [];
            if (Array.isArray(page.images) && page.images.length) {
              for (var fi = 0; fi < page.images.length; fi++) {
                if (page.images[fi].wrap === 'flow') flowImgs.push(page.images[fi]);
              }
            } else if (page.image && page.imageWrap === 'flow') {
              flowImgs.push({ src: page.image, x: page.imageX || 0, y: page.imageY || 0, w: page.imageW || 1.5, rot: page.imageRot || 0 });
            }
            if (!flowImgs.length) continue;
            var m = self.model;
            if (!m) continue;
            var slotEl = el.closest('.zf-mini-page');
            var slotScale = 1;
            if (slotEl) {
              var styleScale = slotEl.style.getPropertyValue('--zf-page-scale');
              slotScale = parseFloat(styleScale) || 1;
            }
            var px = 96 * slotScale;
            var rect = el.getBoundingClientRect();
            if (rect.width < 20 || rect.height < 20) continue;
            var bodyWIn = rect.width / px;
            var bodyHIn = rect.height / px;
            for (var fk = 0; fk < flowImgs.length; fk++) {
              zfInjectFlow(el, flowImgs[fk], px, bodyWIn, bodyHIn);
            }
          }
        },
        _schedSheetRetry: function (attempt) {
          var self = this;
          setTimeout(function () { self._attemptSheetInject(attempt + 1); }, 80);
        },
        printSheet: function () { window.print(); },
        installPaperCss: function () {
          var id = 'zf-paper-css';
          var el = document.getElementById(id);
          if (!el) {
            el = document.createElement('style');
            el.id = id;
            document.head.appendChild(el);
          }
          el.textContent = this.paperCss;
        }
      },
      mounted: function () {
        this.installPaperCss();
        this.sheetInjectFlows();
      },
      updated: function () {
        this.installPaperCss();
        this.sheetInjectFlows();
      },
      template:
        '<div class="zf-sheet-view">' +
          '<component :is="\'style\'" v-html="paperCss"></component>' +
          '<div class="zf-no-print" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">' +
            '<div>' +
              '<h2 style="margin:0;font-family:var(--zf-serif);">{{ model ? model.label : \'No model\' }}</h2>' +
              '<div class="zf-muted">Printable sheet preview. Fold and cut along the dashed guides.</div>' +
            '</div>' +
            '<div class="zf-header-actions" style="gap:0.5rem;">' +
              '<label class="zf-muted" style="display:flex;align-items:center;gap:0.35rem;font-size:0.85rem;cursor:pointer;">' +
                '<input type="checkbox" v-model="showPageNumbers" /> page numbers' +
              '</label>' +
              '<button class="zf-btn zf-btn-primary" @click="printSheet">Print this sheet</button>' +
            '</div>' +
          '</div>' +
          '<div class="zf-sheet" :style="sheetStyle">' +
            '<div class="zf-sheet-guides zf-no-print">' +
              '<div class="zf-fold-h"></div>' +
              '<div class="zf-fold-v"></div>' +
            '</div>' +
            '<div v-for="s in slots" :key="s.key" class="zf-slot" :style="Object.assign({}, s.rect, themeStyle)">' +
              '<div class="zf-mini-page zf-slot-rot" :style="{ transform: \'rotate(\' + s.rotation + \'deg)\', width: \'100%\', height: \'100%\', \'--zf-page-scale\': s.pageScale, \'--zf-page-margin\': s.pageMargin }">' +
                '<span v-if="showPageNumbers && s.pageNum > 1" class="zf-slot-page-num">{{ s.pageNum - 1 }}</span>' +
                '<template v-if="!s.isEmpty">' +
                  '<h3 class="zf-mini-heading" v-if="s.page.heading">{{ s.page.heading }}</h3>' +
                  '<template v-for="img in (s.page.images || [])" :key="\'sl-blk-\' + img.id">' +
                    '<img v-if="img.wrap === \'block\'" ' +
                      'class="zf-mini-image zf-block-image" :src="img.src" alt="" ' +
                      ':style="slotBlockImageStyleFor(img, s)" />' +
                  '</template>' +
                  '<div class="zf-mini-body" :data-slot-page="s.pageNum" v-html="s.bodyHtml" style="position: relative;"></div>' +
                  '<template v-for="img in (s.page.images || [])" :key="\'sl-free-\' + img.id">' +
                    '<img v-if="img.wrap === \'free\' || !img.wrap" ' +
                      'class="zf-mini-image zf-positioned" :src="img.src" alt="" ' +
                      ':style="slotFreeImageStyleFor(img, s)" />' +
                  '</template>' +
                  '<template v-for="box in (s.page.textBoxes || [])" :key="\'sl-tb-\' + box.id">' +
                    '<div class="zf-textbox zf-textbox-readonly" :style="slotTextBoxStyleFor(box, s)">' +
                      '<div class="zf-textbox-content" v-html="box.html"></div>' +
                    '</div>' +
                  '</template>' +
                '</template>' +
                '<div v-else class="zf-slot-empty">page {{ s.pageNum }} empty</div>' +
              '</div>' +

            '</div>' +
          '</div>' +

          '<div class="zf-instructions zf-no-print" v-if="model && model.instructions">' +
            '<h3>Text instructions</h3>' +
            '<ol>' +
              '<li v-for="(step, i) in model.instructions" :key="i">{{ step }}</li>' +
            '</ol>' +
          '</div>' +
        '</div>'
    };

    function loadSharedZineFromHash() {
      var hash = location.hash || '';
      var m = hash.match(/(?:^#|&)z=([^&]+)/);
      if (!m) return;
      try {
        var parsed = JSON.parse(decodeURIComponent(escape(atob(m[1]))));
        if (!parsed || !Array.isArray(parsed.p)) return;
        store.title = parsed.t || 'Untitled Zine';
        store.author = parsed.a || '';
        store.pages = parsed.p.map(function (p, i) {
          return { id: 'p' + i + '-' + Math.random().toString(36).slice(2, 7), heading: p.h || '', body: p.b || '', image: p.i || '' };
        });
        if (!store.pages.length) store.pages = [zfEmptyPage()];
        store.activePageId = store.pages[0].id;
        store.view = 'reader';
      } catch (e) { zfLog('bad share link: ' + e.message); }
    }

    function boot() {
      if (!window.Vue) {
        document.getElementById('app').innerHTML =
          '<div class="zf-empty" style="margin:2rem;">Vue failed to load from the CDN.</div>';
        zfLog('Vue missing - aborting boot');
        return;
      }
      zfLog('Vue found, mounting...');
      try {
        var app = Vue.createApp({
          data: function () { return { store: store }; },
          template: '<app-shell />'
        });
        app.component('app-shell', AppShell);
        app.component('zine-editor', ZineEditor);
        app.component('zine-reader', ZineReader);
        app.component('zine-sheet', ZineSheet);
        app.component('zine-library', ZineLibrary);
        app.config.errorHandler = function (err, instance, info) {
          zfLog('VUE ERROR: ' + (err && err.message ? err.message : err) + ' | info: ' + info);
        };
        app.config.warnHandler = function (msg, instance, trace) {
          zfLog('VUE WARN: ' + msg);
        };
        app.mount('#app');
        zfLog('mounted OK; view=' + store.view + '; pages=' + store.pages.length);
      } catch (e) {
        zfLog('MOUNT ERROR: ' + (e && e.message ? e.message : String(e)));
        zfLog('STACK: ' + (e && e.stack ? e.stack : '(no stack)'));
        try {
          document.getElementById('app').innerHTML =
            '<div class="zf-empty" style="margin:2rem;">Boot failed: ' + (e && e.message ? e.message : String(e)) + '</div>';
        } catch (e2) {}
      }
      loadSharedZineFromHash();
      window.addEventListener('hashchange', loadSharedZineFromHash);

      // Keyboard shortcuts for undo/redo. Skip when focus is inside an
      // input/textarea/contenteditable so users get normal browser undo
      // while typing (which is not what we want for structure changes but
      // is what they'd expect for text).
      window.addEventListener('keydown', function (evt) {
        var cmd = evt.ctrlKey || evt.metaKey;
        if (!cmd) return;
        var key = (evt.key || '').toLowerCase();
        if (key === 'z' && !evt.shiftKey) {
          evt.preventDefault();
          if (window.ZFUndo) window.ZFUndo();
        } else if ((key === 'z' && evt.shiftKey) || key === 'y') {
          evt.preventDefault();
          if (window.ZFRedo) window.ZFRedo();
        }
      });

    // -------- Undo / redo --------
    // Snapshot-based history: keeps the last N "meaningful" states of the
    // zine. A state is captured on a debounce whenever the content changes
    // (same signal the autosave loop uses). This is simple and covers every
    // kind of edit (text, images, text boxes, page ops, model/theme changes).
    var ZF_HISTORY_MAX = 40;
    var zfHistory = [];       // past states, oldest first
    var zfRedo = [];          // future states (after undo)
    var zfLastSnapStr = '';   // last captured state, to detect changes
    var zfSnapTimer = null;
    var zfApplying = false;   // set during undo/redo to suppress snapshots

    function zfCaptureState() {
      return {
        title: store.title,
        author: store.author,
        modelId: store.modelId,
        themeId: store.themeId,
        marginIn: store.marginIn,
        pages: JSON.parse(JSON.stringify(store.pages))
      };
    }

    function zfApplyState(snap) {
      zfApplying = true;
      store.title = snap.title;
      store.author = snap.author;
      store.modelId = snap.modelId;
      store.themeId = snap.themeId;
      store.marginIn = snap.marginIn;
      store.pages = snap.pages.map(function (p) {
        // Ensure optional arrays exist.
        if (!Array.isArray(p.images)) p.images = [];
        if (!Array.isArray(p.textBoxes)) p.textBoxes = [];
        return p;
      });
      if (!store.pages.length) store.pages = [zfEmptyPage()];
      if (!store.pages.find(function (p) { return p.id === store.activePageId; })) {
        store.activePageId = store.pages[0].id;
      }
      zfApplying = false;
      zfLastSnapStr = JSON.stringify(zfCaptureState());
    }

    function zfCommitHistory() {
      // Called from the autosave loop when content has changed. Snapshots the
      // PREVIOUS state (zfLastSnapStr) into history, then updates lastSnap.
      if (zfApplying) return;
      var current = zfCaptureState();
      var currentStr = JSON.stringify(current);
      if (currentStr === zfLastSnapStr) return;
      if (zfLastSnapStr) {
        try {
          zfHistory.push(JSON.parse(zfLastSnapStr));
          if (zfHistory.length > ZF_HISTORY_MAX) zfHistory.shift();
          zfRedo.length = 0;
        } catch (e) { /* ignore */ }
      }
      zfLastSnapStr = currentStr;
    }

    function zfUndo() {
      if (!zfHistory.length) { store.status = 'Nothing to undo.'; return; }
      var current = zfCaptureState();
      var prev = zfHistory.pop();
      zfRedo.push(current);
      zfApplyState(prev);
      store.status = 'Undo.';
      setTimeout(function () { if (store.status === 'Undo.') store.status = ''; }, 1200);
    }

    function zfRedoAction() {
      if (!zfRedo.length) { store.status = 'Nothing to redo.'; return; }
      var next = zfRedo.pop();
      zfHistory.push(zfCaptureState());
      zfApplyState(next);
      store.status = 'Redo.';
      setTimeout(function () { if (store.status === 'Redo.') store.status = ''; }, 1200);
    }

    // Seed the initial snapshot so we have a baseline.
    zfLastSnapStr = JSON.stringify(zfCaptureState());

    // Autosave loop: writes the current draft slot and, if the zine has an
    // id, mirrors it into the local library. Also drives the undo history.
    setInterval(function () {
      var snap = JSON.stringify({
        t: store.title, a: store.author, m: store.modelId, th: store.themeId,
        p: store.pages
      });
      if (snap !== store._zfLastAutoSave) {
        // Check whether it's actually different from the last snapshot.
        // zfCommitHistory handles this internally using its own tracker.
        zfCommitHistory();
        store._zfLastAutoSave = snap;
        store.saveDraft();
        if (store.currentZineId) store.saveToLibrary();
      }
    }, 1500);

    // Expose for buttons and keyboard handlers.
    window.ZFUndo = zfUndo;
    window.ZFRedo = zfRedoAction;
    window.ZFCanUndo = function () { return zfHistory.length > 0; };
    window.ZFCanRedo = function () { return zfRedo.length > 0; };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  </script>
</body>
</html>
