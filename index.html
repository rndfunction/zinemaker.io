<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zine Forge - Make and share zines</title>
  <!-- Content-Security-Policy: REPORT-ONLY. Enforcing this policy breaks the
       app: the page executes INLINE scripts (bootstrap wiring, and the
       srcdoc preview harness injects scripts inline), and enforcing
       script-src without 'unsafe-inline' or a nonce/hash blocks them ->
       blank page. To enforce for real, either:
         (a) add 'unsafe-inline' to script-src (weakens the policy a lot), or
         (b) move all inline scripts to external files, precompile Vue
             templates to drop 'unsafe-eval', and adopt a nonce/hash scheme.
       Until then this stays report-only so violations are logged, not
       fatal. style-src 'unsafe-inline' is still required (mini-page
       positions elements with inline style=; zfSanitizeHtml allowlists
       which style props survive). object-src none / base-uri self still
       document the intended hardening. -->
  <meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self'; script-src 'self' https://unpkg.com https://code.iconify.design; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://api.iconify.design; object-src 'none'; base-uri 'self';" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js" defer></script>

  <script src="js/zine-models.js" defer></script>
  <script src="js/zine-themes.js" defer></script>
  <script src="js/zine-library.js" defer></script>
  <script src="js/util.js" defer></script>
  <script src="js/components/ZfErrorBoundary.js" defer></script>
  <script src="js/components/ZineIconPicker.js" defer></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>
  <!-- Application code is split across the files below. Load order matters:
       models/themes/library/util define the data + helpers the rest depend
       on; zf-store defines the shared reactive store; the component files
       (app-shell, editor, reader, sheet, library-view) define the views;
       zf-boot wires everything together and mounts Vue last. -->
  <script src="js/zf-store.js"></script>
  <script src="js/zf-app-shell.js"></script>
  <script src="js/zf-editor-layers.js"></script>
  <script src="js/zf-editor-drawing.js"></script>
  <script src="js/zf-editor.js"></script>
  <script src="js/zf-editor-component.js"></script>
  <script src="js/zf-reader.js"></script>
  <script src="js/zf-sheet.js"></script>
  <script src="js/zf-library-view.js"></script>
  <script src="js/zf-boot.js"></script>
</body>
</html>
