<!-- zine-editor-template -- UI template partial, fetched and injected as a -->
<!-- <template> element by zf-boot.js before the app mounts. -->
  <template id="zine-editor-template">
    <div class="zf-editor" >
      <aside class="zf-sidebar">

        <div class="zf-label" style="margin-top:0.75rem;">Pages</div>
        <ul class="zf-page-list" ref="pageListEl">
          <li v-for="(p, i) in store.pages" :key="p.id"
              :class="[{ active: p.id === store.activePageId, 'zf-draggable': true }, dragClass(i)]"
              draggable="true"
              @click="selectPage(p.id)"
              @dragstart="onDragStart($event, i)"
              @dragover="onDragOver($event, i)"
              @dragleave="onDragLeave($event, i)"
              @drop="onDrop($event, i)"
              @dragend="onDragEnd">
            <span style="display:flex;align-items:center;gap:0.25rem;min-width:0;">
              <span class="zf-page-grip" aria-hidden="true" title="Drag to reorder">&#x2261;</span>
              <span class="zf-page-num" :class="{ cover: i === 0, back: i === store.pages.length - 1 && store.pages.length > 1 }">{{ i + 1 }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ pageLabel(p, i) }}<span class="zf-mini" v-if="p.image"> (img)</span></span>
            </span>
            <span class="zf-page-tools">
              <button class="zf-icon-btn" @click.stop="store.duplicatePage(p.id)" title="Duplicate page">+</button>
              <button class="zf-icon-btn" @click.stop="store.deletePage(p.id)" title="Delete page">&times;</button>
            </span>
          </li>
          <li class="zf-page-add" @click="store.addPageOrSheet()" role="button" tabindex="0"
              :title="store.isCurrentSheetFull() ? 'This sheet is full. Add a new sheet.' : 'Add a new page at the end'">
            <span class="zf-page-add-label" v-if="!store.isCurrentSheetFull()">+ Add page</span>
            <span class="zf-page-add-label" v-else>+ Add sheet ({{ activeModel ? activeModel.pagesPerSheet : '' }} pages)</span>
          </li>
        </ul>


        <div class="zf-sidebar-layers">
          <button class="zf-sidebar-section-head" @click="layersOpen = !layersOpen" :aria-expanded="layersOpen">
            <span>Layers <span class="zf-mini">&mdash; {{ layers.length }}</span></span>
            <span aria-hidden="true">{{ layersOpen ? "\u25be" : "\u25b8" }}</span>
          </button>
          <div v-show="layersOpen" class="zf-sidebar-layers-body">
            <div v-if="!layers.length" class="zf-muted" style="font-size:0.8rem;">No objects on this page yet.</div>
            <ul class="zf-layers-list" v-else>
               <li v-for="(layer, li) in layers" :key="layer.id"
                   draggable="true"
                   :class="[{ active: isSelected(layer.kind === 'textBox' ? 'textBox' : 'image', layer.id) }, layerDragClass(li)]"
                   @click="selectLayer(layer, $event)"
                  @dragstart="onLayerDragStart($event, li)"
                  @dragover="onLayerDragOver($event, li)"
                  @dragleave="onLayerDragLeave($event, li)"
                  @drop="onLayerDrop($event, li)"
                  @dragend="onLayerDragEnd">
                <iconify-icon class="zf-layer-ico"
                  :icon="layer.kind === 'textBox' ? 'ph:text-t' : (layer.kind === 'icon' ? 'ph:star' : 'ph:image')"
                  aria-hidden="true"></iconify-icon>
                 <span class="zf-layer-label">{{ layerLabel(layer) }}</span>
                 <span class="zf-layer-tools">
                   <button class="zf-icon-btn zf-layer-chain" :class="{ linked: isGrouped(layer.id) }"
                           @click.stop="toggleLayerGroup(layer)"
                           :title="isGrouped(layer.id) ? 'Unlink from group' : 'Link with selection'"
                           :aria-label="isGrouped(layer.id) ? 'Unlink from group' : 'Link with selection'"
                           :aria-pressed="isGrouped(layer.id)">
                     <iconify-icon :icon="isGrouped(layer.id) ? 'ph:link-simple' : 'ph:link-simple-break'" aria-hidden="true"></iconify-icon>
                   </button>
                   <button class="zf-icon-btn zf-opacity-btn"
                           :style="{ background: 'linear-gradient(90deg, rgba(0,94,162,' + ((typeof layer.el.opacity === 'number' ? layer.el.opacity : 1)) + ') 0%, rgba(0,94,162,0.08) 100%)' }"
                           @click.stop="openOpacityMenu($event, layer.id)"
                           :title="'Layer opacity: ' + Math.round(((typeof layer.el.opacity === 'number' ? layer.el.opacity : 1)) * 100) + '%'"
                           :aria-label="'Layer opacity: ' + Math.round(((typeof layer.el.opacity === 'number' ? layer.el.opacity : 1)) * 100) + '%'"
                           :aria-haspopup="'true'"
                           :aria-expanded="opacityMenu.open && opacityMenu.id === layer.id ? 'true' : 'false'">
                     <iconify-icon icon="ph:circle-half" aria-hidden="true"></iconify-icon>
                   </button>
                   <button class="zf-icon-btn" @click.stop="toggleLayerHidden(layer)" :title="layer.el.hidden ? 'Show layer' : 'Hide layer'" :aria-label="layer.el.hidden ? 'Show layer' : 'Hide layer'">
                     <iconify-icon :icon="layer.el.hidden ? 'ph:eye-slash' : 'ph:eye'" aria-hidden="true"></iconify-icon>
                   </button>
                  <button class="zf-icon-btn" @click.stop="removeLayer(layer)" title="Delete layer" aria-label="Delete layer">&times;</button>
                </span>
              </li>
            </ul>
          </div>
        </div>
        <div class="zf-sidebar-danger">
          <button type="button" class="zf-sidebar-clear" @click="onClearAllEditor" title="Remove all content from every page">
            Clear all content
          </button>
        </div>
      </aside>

      <div class="zf-canvas-col">
        <div class="zf-canvas-empty-hint" v-if="isEmptyPage(active)">
          Start your page: type a heading, then write below. Use the tools on the right to add an image, icon, or text box.
        </div>
        <div class="zf-canvas-wrap" @mousedown.self="onCanvasDeskMouseDown">
          <div class="zf-ghost-page zf-ghost-prev" v-if="prevPage" role="button" tabindex="0"
               @click="goToPageId(prevPage.id)" @keydown.enter="goToPageId(prevPage.id)"
               :aria-label="'Go to previous page'"
               :title="'Go to previous page'">
            <span class="zf-ghost-label">Page {{ activeIndex }}</span>
            <div class="zf-ghost-render" aria-hidden="true" :style="ghostFrameStyle(prevPage)">
              <div class="zf-mini-page zf-ghost-mini" :style="ghostPageStyle(prevPage)">
                <template v-for="img in (prevPage.images || [])" :key="'gpb-' + img.id">
                  <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                       class="zf-mini-image zf-block-image" :src="img.src" alt=""
                       :style="ghostBlockStyle(img)" />
                   <div v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                        class="zf-mini-image zf-block-image zf-block-icon"
                        :style="Object.assign({}, ghostBlockStyle(img), { color: img.color || 'inherit' })"
                        v-html="iconInline(img)"></div>
                </template>
                <!-- inline body retired: text renders in text boxes below -->
                <template v-for="img in (prevPage.images || [])" :key="'gpf-' + img.id">
                  <div v-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'tape'"
                       class="zf-tape zf-positioned" :class="'zf-tape-' + (img.color || 'beige')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'scrap'"
                       class="zf-scrap zf-positioned" :class="'zf-scrap-' + (img.color || 'kraft')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticky'"
                       class="zf-sticky zf-positioned" :class="'zf-sticky-' + (img.color || 'yellow')" :style="stickyStyle(img, ghostFreeStyle(img))"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticker'"
                       class="zf-sticker zf-positioned" :class="'zf-sticker-' + (img.shape || 'circle')" :style="stickerStyle(img, ghostFreeStyle(img))"></div>
                  <img v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind !== 'icon'"
                       class="zf-mini-image zf-positioned" :src="img.src" alt="" :style="ghostFreeStyle(img)" />
                   <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'icon'"
                        class="zf-mini-image zf-positioned zf-positioned-icon-wrap"
                        :style="Object.assign({}, ghostFreeStyle(img), { color: img.color || 'inherit' })"
                        v-html="iconInline(img)"></div>
                </template>
                <template v-for="box in (prevPage.textBoxes || [])" :key="'gpt-' + box.id">
                  <div v-if="!box.hidden" class="zf-textbox zf-textbox-readonly"
                       :class="{ 'zf-stamp': box.kind === 'stamp', 'zf-panel': box.kind === 'panel', 'zf-textbox-overlay': box.overlay }"
                       :style="ghostTextBoxStyle(box)">
                    <div class="zf-textbox-content" v-html="box.html"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <div class="zf-page zf-mini-page" ref="miniPage" :style="Object.assign({}, pageStyle, pageThemeStyle)" @mousedown="onBodyMouseDown">
            <template v-for="g in safeGuides" :key="g.key">
              <div class="zf-mini-safe-guide" :style="g.style"></div>
            </template>

            <!-- Drawing overlay: only present while drawingMode is on. Sits on
                 top of the page content and captures pointer events so a drag
                 draws a stroke instead of dragging an element or editing text.
                 The toolbar floats above it. -->
            <!-- Drawing overlay: just the canvas now. The pen tools live in
                 the floating properties panel (panelMode === 'draw') beside
                 the rail, so they do not cover the page. -->
            <div v-if="drawingMode" class="zf-draw-layer">
              <canvas ref="drawCanvas" class="zf-draw-canvas"
                      @pointerdown="onDrawPointerDown"
                      @pointermove="onDrawPointerMove"
                      @pointerup="onDrawPointerUp"
                      @pointerleave="onDrawPointerUp"></canvas>
            </div>

            <template v-for="img in (active.images || [])" :key="'blk-' + img.id">
              <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                   class="zf-mini-image zf-block-image"
                   :src="img.src" alt="Page illustration"
                   :style="imageBlockStyle(img)" />
               <div v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                    class="zf-mini-image zf-block-image zf-block-icon"
                    :style="Object.assign({}, imageBlockStyle(img), { color: img.color || 'inherit' })"
                    v-html="iconInline(img)"></div>
            </template>
              <!-- Inline page body retired: text lives in text boxes only. -->

            <template v-for="box in (active.textBoxes || [])" :key="'tb-' + box.id">
              <div v-if="!box.hidden" class="zf-textbox"
                   tabindex="0"
                      :class="[{ 'zf-textbox-selected': isSelected('textBox', box.id), 'zf-single-selected': isSingleSelected('textBox', box.id), 'zf-handle-owner': active.activeTextBoxId === box.id && !isMultiSelected, 'zf-multi-selected': isMultiSelected && isSelected('textBox', box.id), 'zf-stamp': box.kind === 'stamp', 'zf-panel': box.kind === 'panel', 'zf-textbox-overlay': box.overlay, 'zf-element-hover': hoveredEl.kind === 'textBox' && hoveredEl.id === box.id && !isSelected('textBox', box.id) }]"
                   :data-zf-text-id="box.id"
                   :style="textStyle(box)"
                     @mousedown="onTextBoxMouseDown($event, box)"
                     @click.stop="onElementClick('textBox', box, $event)"
                     @contextmenu.prevent.stop="openContextMenu($event, 'textBox', box.id)"
                    @keydown="onTextBoxKeydown($event, box)">
                <div class="zf-textbox-content"
                     :data-zf-text-content-id="box.id"
                     contenteditable="true"
                     @input="onTextBoxInput($event, box)"
                     @paste="onTextBoxPaste($event, box)"
                     @mousedown.stop></div>
                <span v-if="!isMultiSelected" class="zf-img-handle zf-img-handle-resize"
                      title="Drag to resize (scales text)"
                      @mousedown.stop.prevent="onTextBoxResizeStartScaled($event, box)"></span>
                <span v-if="!isMultiSelected" class="zf-img-handle zf-img-handle-rotate"
                      title="Drag to rotate"
                      @mousedown.stop.prevent="onTextBoxRotateStart($event, box)"></span>
              </div>
            </template>

            <template v-for="img in (active.images || [])" :key="'ovl-' + img.id">
              <div v-if="(img.wrap === 'free' || !img.wrap) && !img.hidden && img.id !== editDrawingId"
                   class="zf-img-wrap"
                   :data-zf-img-id="img.id"
                   tabindex="0"
                      :class="{ 'zf-img-selected': isSelected('image', img.id), 'zf-single-selected': isSingleSelected('image', img.id), 'zf-handle-owner': active.activeImageId === img.id && !isMultiSelected, 'zf-multi-selected': isMultiSelected && isSelected('image', img.id), 'zf-image-dragging': imageDrag && imageDrag.imgId === img.id, 'zf-img-placeholder': img.placeholder, 'zf-element-hover': hoveredEl.kind === 'image' && hoveredEl.id === img.id && !isSelected('image', img.id) }"
                   :style="Object.assign({}, imageStyle(img), (img.kind === 'icon' ? { fontSize: iconFontPx(img) + 'px' } : {}))"
                     @mousedown="onImageMouseDownItem($event, img)"
                     @click.stop="onElementClick('image', img, $event)"
                     @dblclick.stop="editDrawing(img)"
                    @contextmenu.prevent.stop="openContextMenu($event, 'image', img.id)"
                    @keydown.delete.prevent="deleteSelectedElement"
                    @keydown.backspace.prevent="deleteSelectedElement">
                 <div v-if="img.kind === 'tape'" class="zf-tape" :class="'zf-tape-' + (img.color || 'beige')" aria-hidden="true"></div>
                 <div v-else-if="img.kind === 'scrap'" class="zf-scrap" :class="'zf-scrap-' + (img.color || 'kraft')" aria-hidden="true"></div>
                 <div v-else-if="img.kind === 'sticky'" class="zf-sticky" :class="'zf-sticky-' + (img.color || 'yellow')" :style="stickyStyle(img, {})" aria-hidden="true"></div>
                 <div v-else-if="img.kind === 'sticker'" class="zf-sticker" :class="'zf-sticker-' + (img.shape || 'circle')" :style="stickerStyle(img, {})" aria-hidden="true"></div>
                 <img v-else-if="img.kind !== 'icon'" :src="img.src" alt="Page illustration" />
                  <div v-else class="zf-icon-element" :style="{ width: '100%', height: '100%', color: img.color || 'inherit' }" v-html="iconInline(img)"></div>
                <span class="zf-img-handle zf-img-handle-resize"
                      title="Drag to resize"
                      @mousedown.stop.prevent="onResizeStart($event, img)"></span>
                <span class="zf-img-handle zf-img-handle-rotate"
                      title="Drag to rotate"
                      @mousedown.stop.prevent="onRotateStart($event, img)"></span>
              </div>
            </template>

          </div>

          <div class="zf-ghost-page zf-ghost-next" v-if="nextPage" role="button" tabindex="0"
               @click="goToPageId(nextPage.id)" @keydown.enter="goToPageId(nextPage.id)"
               :aria-label="'Go to next page'"
               :title="'Go to next page'">
            <span class="zf-ghost-label">Page {{ activeIndex + 2 }}</span>
            <div class="zf-ghost-render" aria-hidden="true" :style="ghostFrameStyle(nextPage)">
              <div class="zf-mini-page zf-ghost-mini" :style="ghostPageStyle(nextPage)">
                <template v-for="img in (nextPage.images || [])" :key="'gnb-' + img.id">
                  <img v-if="img.wrap === 'block' && img.kind !== 'icon'"
                       class="zf-mini-image zf-block-image" :src="img.src" alt=""
                       :style="ghostBlockStyle(img)" />
                   <div v-else-if="img.wrap === 'block' && img.kind === 'icon'"
                        class="zf-mini-image zf-block-image zf-block-icon"
                        :style="Object.assign({}, ghostBlockStyle(img), { color: img.color || 'inherit' })"
                        v-html="iconInline(img)"></div>
                </template>
                <!-- inline body retired: text renders in text boxes below -->
                <template v-for="img in (nextPage.images || [])" :key="'gnf-' + img.id">
                  <div v-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'tape'"
                       class="zf-tape zf-positioned" :class="'zf-tape-' + (img.color || 'beige')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'scrap'"
                       class="zf-scrap zf-positioned" :class="'zf-scrap-' + (img.color || 'kraft')" :style="ghostFreeStyle(img)"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticky'"
                       class="zf-sticky zf-positioned" :class="'zf-sticky-' + (img.color || 'yellow')" :style="stickyStyle(img, ghostFreeStyle(img))"></div>
                  <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'sticker'"
                       class="zf-sticker zf-positioned" :class="'zf-sticker-' + (img.shape || 'circle')" :style="stickerStyle(img, ghostFreeStyle(img))"></div>
                  <img v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind !== 'icon'"
                       class="zf-mini-image zf-positioned" :src="img.src" alt="" :style="ghostFreeStyle(img)" />
                   <div v-else-if="(img.wrap === 'free' || !img.wrap) && img.kind === 'icon'"
                        class="zf-mini-image zf-positioned zf-positioned-icon-wrap"
                        :style="Object.assign({}, ghostFreeStyle(img), { color: img.color || 'inherit' })"
                        v-html="iconInline(img)"></div>
                </template>
                <template v-for="box in (nextPage.textBoxes || [])" :key="'gnt-' + box.id">
                  <div v-if="!box.hidden" class="zf-textbox zf-textbox-readonly"
                       :class="{ 'zf-stamp': box.kind === 'stamp', 'zf-panel': box.kind === 'panel', 'zf-textbox-overlay': box.overlay }"
                       :style="ghostTextBoxStyle(box)">
                    <div class="zf-textbox-content" v-html="box.html"></div>
                  </div>
                </template>
              </div>
            </div>
          </div>
          <!-- Group selection box: ONE box around the whole multi-selection.
               Rendered OUTSIDE the mini-page (which clips content) so it can
               extend past the page into the workspace and stay reachable.
               Positioned by JS (updateGroupBox). -->
          <div v-if="isMultiSelected" ref="groupBoxEl" class="zf-group-select-box">
            <span class="zf-group-handle zf-group-handle-rotate" title="Rotate selection"
                  style="right:-8px;top:-8px;left:auto;margin-left:0;"
                  @mousedown.stop.prevent="onGroupRotateStart($event)"></span>
            <span class="zf-group-handle zf-group-handle-corner" style="right:-6px;bottom:-6px;"
                  @mousedown.stop.prevent="onGroupResizeStart($event)"></span>
          </div>
        </div>
        <!-- Rubber-band marquee: a fixed (un-clipped) box drawn while
             dragging on empty page space to select elements. -->
        <div v-if="marquee.active && marquee.moved" class="zf-marquee"
             :style="{ left: marquee.x + 'px', top: marquee.y + 'px', width: marquee.w + 'px', height: marquee.h + 'px' }"
             aria-hidden="true"></div>
        <!-- Overlap picker: lists the elements stacked under the cursor so a
             specific one can be chosen by name when they overlap. -->
        <div v-if="overlapPicker.open" class="zf-overlap-picker"
             :style="{ top: overlapPicker.y + 'px', left: overlapPicker.x + 'px' }" role="listbox" aria-label="Overlapping elements"
             @mouseenter="onPickerEnter" @mouseleave="onPickerLeave">
          <button v-for="(item, oi) in overlapPicker.items" :key="'ov-' + oi"
                  type="button" class="zf-overlap-item" role="option"
                  @click.stop="pickOverlap(item)">
            <iconify-icon class="zf-overlap-glyph" :icon="item.glyph" aria-hidden="true"></iconify-icon>
            <span class="zf-overlap-name">{{ item.name }}</span>
          </button>
        </div>
        <!-- Right-click context menu for any element (everything is a layer).
             Positioned at the cursor; closes on outside click / Esc / scroll. -->
            <div v-if="opacityMenu.open" class="zf-opacity-menu"
                 :style="{ top: opacityMenu.y + 'px', left: opacityMenu.x + 'px' }"
                 role="dialog" aria-label="Layer opacity">
              <label class="zf-text-panel-label" style="display:block;margin-bottom:0.25rem;">Layer opacity</label>
              <input class="zf-layer-opacity" type="range" min="0.1" max="1" step="0.05"
                     :value="opacityMenuValue()"
                     @input.stop="setOpacityFor(opacityMenu.id, Number($event.target.value))"
                     aria-label="Layer opacity" style="width:140px;" />
              <div style="font-size:0.75rem;color:var(--zf-gray-mid);margin-top:0.15rem;text-align:right;">
                {{ Math.round(opacityMenuValue() * 100) }}%
              </div>
            </div>
            <div v-if="ctxMenu.open" class="zf-ctx-menu" :style="{ top: ctxMenu.y + 'px', left: ctxMenu.x + 'px' }"
                 role="menu" @contextmenu.prevent>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('front')">Bring to Front</button>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('forward')">Bring Forward</button>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('backward')">Send Backward</button>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('back')">Send to Back</button>
          <div class="zf-ctx-sep" aria-hidden="true"></div>
          <button v-if="canGroupSelection" type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('group')">Group</button>
          <button v-if="canUngroupSelection" type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('ungroup')">Ungroup</button>
          <div v-if="canGroupSelection || canUngroupSelection" class="zf-ctx-sep" aria-hidden="true"></div>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('duplicate')">Duplicate</button>
          <button type="button" class="zf-ctx-item" role="menuitem" @click="ctxAction('copy')">Copy</button>
          <button type="button" class="zf-ctx-item zf-ctx-danger" role="menuitem" @click="ctxAction('delete')">Delete</button>
        </div>
        <zine-icon-picker
          :open="iconPickerOpen"
          @select="addIcon"
          @close="closeIconPicker"></zine-icon-picker>        <div class="zf-modal-backdrop" v-if="qrModalOpen" @click.self="closeQrModal">
          <div class="zf-modal" role="dialog" aria-label="Add a QR code">
            <div class="zf-modal-header">
              <h2>Add a QR code</h2>
              <button class="zf-modal-close" @click="closeQrModal" aria-label="Close">&times;</button>
            </div>
            <div class="zf-field">
              <label class="zf-label" for="zf-qr-url">Text or link</label>
              <input id="zf-qr-url" class="zf-input" v-model="qrUrl" type="text"
                     placeholder="https://example.com" @keydown.enter="generateQr" />
            </div>
            <div class="zf-muted" style="font-size:0.8rem;margin-bottom:1rem;">
              Usually a link, but any short text works - a phone number, a note, or a password.
              We'll make it into a scannable QR code image you can place on the page.
            </div>
            <div class="zf-header-actions" style="justify-content:flex-end;">
              <button class="zf-btn" style="border-color:var(--zf-border);" @click="closeQrModal">Cancel</button>
              <button class="zf-btn zf-btn-primary" @click="generateQr">Add QR code</button>
            </div>
          </div>
        </div>


      </div>

      <aside class="zf-rail" ref="railEl" aria-label="Formatting and insert tools">


        <div class="zf-rail-sep" aria-hidden="true"></div>
        <div class="zf-rail-group" role="toolbar" aria-label="Add elements">
          <!-- Order: Text, Pen, Image, Icon, Tape (decorations), QR, Background image -->

      <!-- Text panel: absolutely-positioned overlay to the RIGHT of the rail,

            <button class="zf-btn" :class="{ 'zf-btn-primary': drawTool === 'calligraphy' }" @click="drawTool = 'calligraphy'" title="Calligraphy (flat nib)">Callig.</button>

          <input type="range" min="1" max="40" step="1" v-model.number="drawSize" style="width:100%;" aria-label="Brush size" />

          <template v-if="selectedImage.kind === 'icon'">
            <label class="zf-text-panel-label" for="zf-ip-icon-color">Icon color</label>
            <div class="zf-text-panel-row">
              <input id="zf-ip-icon-color" type="color" :value="activeColorHex" @input="setIconColor($event.target.value)" style="width:44px;height:28px;border:1px solid var(--zf-border);border-radius:4px;background:#ffffff;cursor:pointer;" aria-label="Icon color" />
              <button class="zf-btn" style="border-color:var(--zf-border);font-size:0.8rem;" @click="setIconColor('')">Theme color</button>
            </div>
          </template>

          <template v-if="selectedImage.kind === 'sticker'">
            <span class="zf-text-panel-label">Shape</span>
            <div class="zf-text-panel-row zf-text-panel-align">
              <button class="zf-btn" :class="{ 'zf-btn-primary': selectedImage.shape === 'circle' || !selectedImage.shape }" @click="setStickerShape('circle')">Circle</button>
              <button class="zf-btn" :class="{ 'zf-btn-primary': selectedImage.shape === 'oval' }" @click="setStickerShape('oval')">Oval</button>
              <button class="zf-btn" :class="{ 'zf-btn-primary': selectedImage.shape === 'square' }" @click="setStickerShape('square')">Square</button>
              <button class="zf-btn" :class="{ 'zf-btn-primary': selectedImage.shape === 'starburst' }" @click="setStickerShape('starburst')">Star</button>
            </div>
          </template>
        </template>
